<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CasePath turns a new claim submission into a clear handling process, targeted evidence needs, prepared documents, and the next safe action.">
  <meta name="theme-color" content="#ffffff">
  <title>CasePath — Claim workspace</title>
  <style>
    :root {
      --paper:#ffffff;
      --canvas:#fbfbfa;
      --ink:#181716;
      --muted:#6f6b67;
      --faint:#99948e;
      --line:#e8e5e1;
      --line-strong:#d8d3cd;
      --accent:#c8102e;
      --accent-hover:#a90d27;
      --accent-soft:#fff1f3;
      --green:#24795d;
      --green-soft:#edf7f3;
      --amber:#a05b14;
      --amber-soft:#fff7ec;
      --blue:#315f91;
      --blue-soft:#f0f5fa;
      --shadow:0 18px 60px rgba(35,29,24,.12);
      --radius:12px;
      --header:68px;
      --max:1280px;
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--canvas)}
    body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .skip{position:fixed;left:16px;top:-60px;z-index:300;background:var(--ink);color:white;padding:10px 14px;border-radius:8px}.skip:focus{top:12px}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    :focus-visible{outline:3px solid rgba(200,16,46,.25);outline-offset:3px}
    .app-header{height:var(--header);position:sticky;top:0;z-index:80;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .header-inner{max-width:var(--max);height:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:30px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:760;letter-spacing:-.02em;white-space:nowrap}
    .brand-mark{width:31px;height:31px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:820;font-size:14px}
    .global-nav{display:flex;align-self:stretch;gap:2px}
    .global-nav button{height:100%;border:0;background:transparent;padding:0 14px;color:var(--muted);font-weight:620;position:relative}
    .global-nav button:hover{color:var(--ink)}
    .global-nav button[aria-current="page"]{color:var(--ink)}
    .global-nav button[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;bottom:0;height:2px;background:var(--accent)}
    .header-spacer{flex:1}
    .release{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}
    .release-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    .btn{border:1px solid var(--line-strong);background:#fff;border-radius:9px;padding:10px 14px;font-weight:690;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .16s,border-color .16s,transform .16s}
    .btn:hover{background:#f7f6f4;border-color:#c9c3bc}
    .btn:active{transform:translateY(1px)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
    .btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
    .btn.dark:hover{background:#302d2a;border-color:#302d2a}
    .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
    .btn.ghost:hover{background:#f4f2f0;color:var(--ink)}
    .btn.small{padding:8px 10px;font-size:13px}
    .icon-btn{width:40px;height:40px;padding:0}
    .icon{width:18px;height:18px;display:inline-block;vertical-align:-3px;flex:0 0 auto}
    .page{max-width:var(--max);margin:0 auto;padding:46px 28px 110px}
    .page.narrow{max-width:980px}
    .page-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(34px,4.4vw,58px);line-height:1.03;letter-spacing:-.055em;margin-bottom:13px;font-weight:780}
    h2{font-size:clamp(25px,2.6vw,36px);line-height:1.12;letter-spacing:-.035em;margin-bottom:9px}
    h3{font-size:18px;line-height:1.25;letter-spacing:-.018em;margin-bottom:7px}
    .lede{font-size:18px;line-height:1.55;color:var(--muted);max-width:720px;margin-bottom:0}
    .eyeline{font-size:12px;font-weight:760;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
    .meta{display:flex;flex-wrap:wrap;gap:7px 16px;color:var(--muted);font-size:13px}
    .meta span{display:inline-flex;align-items:center;gap:6px}
    .divider{height:1px;background:var(--line)}
    .new-claim-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:64px;align-items:start}
    .intake-form{border-top:1px solid var(--line);padding-top:26px}
    .field{display:grid;gap:8px;margin-bottom:22px}
    .field label{font-weight:700}
    .field .help{font-size:12px;color:var(--muted)}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:10px;padding:12px 13px;transition:border-color .16s,box-shadow .16s}
    .field textarea{min-height:210px;resize:vertical;line-height:1.65}
    .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(200,16,46,.08)}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .dropzone{border:1px dashed #c9c3bc;background:#fff;border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .dropzone strong{display:block;margin-bottom:2px}.dropzone p{margin:0;color:var(--muted);font-size:13px}
    .file-list{border-top:1px solid var(--line);margin-top:8px}
    .file-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
    .file-type{width:30px;height:34px;border:1px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--muted)}
    .file-row strong{display:block;font-size:13px}.file-row small{color:var(--muted)}
    .intake-aside{position:sticky;top:calc(var(--header) + 32px);padding-left:30px;border-left:1px solid var(--line)}
    .aside-step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:0 0 24px;position:relative}
    .aside-step:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--line)}
    .aside-num{width:24px;height:24px;border-radius:50%;background:#f0eeeb;display:grid;place-items:center;font-size:11px;font-weight:760;color:var(--muted);z-index:1}
    .aside-step strong{display:block;margin-bottom:2px}.aside-step p{color:var(--muted);font-size:13px;margin:0}
    .form-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:28px}
    .form-actions .note{font-size:12px;color:var(--muted);max-width:420px}
    .analysis-screen{max-width:760px;margin:8vh auto 0;text-align:center}
    .analysis-screen h1{font-size:42px}
    .analysis-pulse{width:70px;height:70px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin:0 auto 26px;position:relative}
    .analysis-pulse::after{content:"";position:absolute;inset:-1px;border:1px solid rgba(200,16,46,.25);border-radius:50%;animation:pulse 1.8s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
    .analysis-list{max-width:520px;margin:36px auto 0;text-align:left;border-top:1px solid var(--line)}
    .analysis-item{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 2px;border-bottom:1px solid var(--line);color:var(--muted)}
    .analysis-item strong{color:var(--ink)}
    .analysis-status{font-size:12px}.analysis-status.done{color:var(--green)}.analysis-status.active{color:var(--accent)}
    .inbox-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}
    .inbox-head h1{font-size:46px;margin:0 0 6px}
    .inbox-controls{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .search{flex:1;position:relative}
    .search input{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:11px 12px 11px 39px;background:#fff}
    .search svg{position:absolute;left:13px;top:12px;color:var(--muted)}
    .select{border:1px solid var(--line-strong);border-radius:9px;padding:10px 34px 10px 11px;background:#fff}
    .claim-table{background:#fff;border-top:1px solid var(--line-strong)}
    .claim-row{display:grid;grid-template-columns:minmax(260px,1.6fr) 160px 110px 150px 120px;gap:22px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--line);transition:background .14s}
    .claim-row.header{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:11px;padding-bottom:11px;background:var(--canvas)}
    .claim-row:not(.header):hover{background:#f7f6f4}
    .claim-subject{font-weight:720;margin-bottom:3px}.claim-preview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status-text{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:680}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
    .status-text.new .status-dot{background:var(--blue)}.status-text.review .status-dot{background:var(--amber)}.status-text.done .status-dot{background:var(--green)}.status-text.candidate .status-dot{background:var(--accent)}
    .workspace{max-width:var(--max);margin:0 auto;padding:30px 28px 120px}
    .back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:28px;border:0;background:transparent;padding:0}
    .workspace-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start;padding-bottom:30px;border-bottom:1px solid var(--line)}
    .workspace-head h1{font-size:clamp(38px,4.6vw,62px);max-width:900px;margin-bottom:12px}
    .workspace-head-actions{display:flex;align-items:center;gap:8px;padding-top:4px}
    .claim-verdict{font-size:20px;line-height:1.5;max-width:870px;margin:28px 0 0}
    .claim-verdict strong{color:var(--accent)}
    .workspace-nav{position:sticky;top:var(--header);z-index:50;background:rgba(251,251,250,.96);backdrop-filter:blur(12px);display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 2px;margin-bottom:0}
    .workspace-nav button{font-size:13px;font-weight:670;color:var(--muted);padding:14px 0 12px;border:0;border-bottom:2px solid transparent;background:transparent;white-space:nowrap}
    .workspace-nav button:hover{color:var(--ink)}
    .workspace-section{display:grid;grid-template-columns:220px minmax(0,1fr);gap:58px;padding:54px 0;border-bottom:1px solid var(--line);scroll-margin-top:130px}
    .section-label h2{font-size:18px;margin:0 0 7px;letter-spacing:-.018em}.section-label p{color:var(--muted);font-size:13px;margin:0}
    .arrival-summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:42px}
    .quote{font-size:22px;line-height:1.55;letter-spacing:-.015em;margin:0;padding-left:24px;border-left:3px solid var(--accent)}
    .attachment-summary{border-top:1px solid var(--line)}
    .attachment-summary .file-row{padding:10px 0}
    .facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;border-top:1px solid var(--line)}
    .fact-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
    .fact-row dt{color:var(--muted)}.fact-row dd{margin:0;font-weight:650}
    .issue-list{margin-top:28px;border-top:1px solid var(--line)}
    .issue-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}
    .issue-row h3{font-size:15px;margin:0 0 2px}.issue-row p{font-size:13px;color:var(--muted);margin:0}.issue-severity{font-size:11px;color:var(--amber);font-weight:740;text-transform:uppercase;letter-spacing:.06em}
    .process-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:54px;align-items:start}
    .process-path{position:relative}
    .process-step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:0 0 26px;position:relative;border:0;background:transparent;width:100%;text-align:left}
    .process-step:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:1px;background:var(--line-strong)}
    .step-mark{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:780;color:var(--muted);z-index:1}
    .process-step.complete .step-mark{background:var(--green-soft);border-color:#badccd;color:var(--green)}
    .process-step.current .step-mark{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-soft)}
    .process-step.future{opacity:.55}
    .process-step h3{font-size:15px;margin:1px 0 3px}.process-step p{font-size:12px;color:var(--muted);margin:0}.process-step.current h3{color:var(--accent)}
    .process-detail{min-height:480px;padding-left:34px;border-left:1px solid var(--line)}
    .process-detail-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
    .process-detail h2{font-size:34px;max-width:720px}
    .blocker-tag{color:var(--accent);font-size:12px;font-weight:740;white-space:nowrap;padding-top:8px}
    .detail-intro{font-size:17px;color:var(--muted);max-width:760px}
    .question-chain{margin-top:36px;border-top:1px solid var(--line)}
    .chain-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;padding:17px 0;border-bottom:1px solid var(--line)}
    .chain-row dt{color:var(--muted);font-size:13px}.chain-row dd{margin:0;font-weight:600}
    .evidence-inline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}
    .evidence-group h3{font-size:14px;margin-bottom:10px}.evidence-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.evidence-row strong{display:block;font-size:13px}.evidence-row small{color:var(--muted)}
    .semantic-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}.semantic-mark.ok{background:var(--green-soft);color:var(--green)}.semantic-mark.need{background:var(--accent-soft);color:var(--accent)}.semantic-mark.conditional{background:var(--amber-soft);color:var(--amber)}
    .next-action-band{margin-top:34px;background:var(--ink);color:#fff;padding:23px 25px;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:22px}
    .next-action-band strong{display:block;font-size:19px;margin-bottom:3px}.next-action-band p{margin:0;color:#c9c5c0;font-size:13px}
    .checklist{border-top:1px solid var(--line)}
    .checklist-group{padding-top:28px}.checklist-group:first-child{padding-top:0}.checklist-group h3{font-size:14px;margin:0 0 9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .check-row{display:grid;grid-template-columns:32px minmax(180px,.7fr) minmax(250px,1.3fr) auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
    .check-control{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;display:grid;place-items:center;color:transparent}
    .check-row.complete .check-control{background:var(--green);border-color:var(--green);color:#fff}
    .check-row strong{font-size:14px}.check-row p{margin:0;color:var(--muted);font-size:13px}.why-btn{border:0;background:transparent;color:var(--accent);font-weight:680;font-size:12px;padding:6px}
    .doc-drafts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
    .draft{border-top:2px solid var(--ink);padding:20px 0 0}.draft h3{font-size:20px}.draft p{color:var(--muted)}.draft-actions{display:flex;gap:8px;margin-top:18px}
    .similar-list{border-top:1px solid var(--line)}
    .similar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:22px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
    .similar-score{font-weight:760;color:var(--green)}.similar-row h3{font-size:15px;margin:0 0 4px}.similar-row p{color:var(--muted);font-size:13px;margin:0}
    .review-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center}.review-summary h3{font-size:25px}.review-summary p{color:var(--muted);max-width:690px}
    .footer-note{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;padding-top:22px}
    .drawer-backdrop{position:fixed;inset:0;background:rgba(24,23,22,.28);z-index:120;opacity:0;pointer-events:none;transition:opacity .18s}
    .drawer-backdrop.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:#fff;z-index:130;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer-head{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;border-bottom:1px solid var(--line)}
    .drawer-head h2{font-size:20px;margin:0}.drawer-body{padding:26px 24px 40px;overflow:auto;flex:1}.drawer-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fff}
    .audit-stage{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:0 0 24px;position:relative}
    .audit-stage:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--line)}
    .audit-mark{width:30px;height:30px;border-radius:50%;background:#f1efec;display:grid;place-items:center;font-size:11px;font-weight:760;z-index:1}.audit-stage h3{font-size:15px;margin:2px 0 4px}.audit-stage p{font-size:13px;color:var(--muted);margin:0 0 8px}.audit-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--faint)}
    details{border-top:1px solid var(--line);padding:13px 0}details summary{cursor:pointer;font-weight:680}details pre{white-space:pre-wrap;word-break:break-word;background:#f7f6f4;padding:13px;border-radius:8px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#3c3834;max-height:320px;overflow:auto}
    .review-form .field textarea{min-height:100px}.decision-row{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.decision-row h3{font-size:14px;margin:0 0 3px}.decision-row p{font-size:12px;color:var(--muted);margin:0}.decision-row select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px;background:#fff}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;border-radius:10px;padding:13px 16px;box-shadow:var(--shadow);z-index:200;display:flex;align-items:center;gap:14px;transition:transform .24s;max-width:min(540px,calc(100vw - 28px))}.toast.show{transform:translate(-50%,0)}.toast button{border:0;background:transparent;color:#fff;text-decoration:underline;font-weight:650}
    .knowledge-search{max-width:820px;margin:0 auto 46px;text-align:center}.knowledge-search h1{font-size:54px}.knowledge-search .search input{font-size:17px;padding:16px 16px 16px 48px;border-radius:12px}.knowledge-search .search svg{left:16px;top:17px}
    .knowledge-sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px}.knowledge-section{border-top:2px solid var(--ink);padding-top:18px}.knowledge-section h2{font-size:23px}.knowledge-section p{color:var(--muted)}.knowledge-link{display:block;padding:12px 0;border-top:1px solid var(--line);font-weight:650}.knowledge-link small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
    .system-list{border-top:1px solid var(--line-strong)}.module-row{display:grid;grid-template-columns:minmax(240px,1.2fr) minmax(240px,1fr) 120px auto;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.module-row h3{font-size:15px;margin:0 0 3px}.module-row p{font-size:12px;color:var(--muted);margin:0}.module-status{font-size:12px;color:var(--green);font-weight:680}
    .state-screen{max-width:640px;margin:12vh auto;text-align:center}.state-icon{width:58px;height:58px;border-radius:50%;background:#f0eeeb;display:grid;place-items:center;margin:0 auto 22px;color:var(--muted)}.state-screen h1{font-size:42px}.state-screen p{font-size:17px;color:var(--muted)}

    @media (max-width: 920px){

<script>
(() => {

    {id:'DEF-014-D1', subject:'Heating fails overnight', preview:'The apartment falls below 17°C and the landlord has not arranged a repair.', type:'Heating defect', lang:'German', files:3, status:'Ready to review', statusClass:'review', updated:'Yesterday', customer:'Nina Schmid'},

    {id:'RNT-008-D1', subject:'Rent increase after renovation', preview:'The official form and calculation date do not agree.', type:'Rent increase', lang:'German', files:4, status:'Knowledge candidate', statusClass:'candidate', updated:'3 days ago', customer:'Sofia Huber'},
    {id:'DEP-006-E1', subject:'Deposit not released', preview:'The tenant moved out six months ago and disputes alleged repair deductions.', type:'Security deposit', lang:'English', files:5, status:'Reviewed', statusClass:'done', updated:'4 days ago', customer:'David Martin'},
    {id:'TER-011-D1', subject:'Termination after complaint', preview:'The tenant received a termination notice shortly after reporting defects.', type:'Termination', lang:'German', files:3, status:'Ready to review', statusClass:'review', updated:'5 days ago', customer:'Elena Rossi'},

  const northStar = {
    id:'NEW-BS-2026-001', customer:'Anna Keller', policy:'LP-88421-BS', jurisdiction:'Basel-Stadt', language:'English', submitted:'7 Aug 2026, 09:31',
    subject:'Recurring mould after renovation',
    message:`I have had black mould in the bedroom since November. The landlord renovated the outer wall in October and says I do not ventilate enough. I wrote to the landlord on 12 January and again on 3 February, but the problem keeps returning. My daughter has started coughing at night. The claim form says the mould began on 18 November, while my first email says 10 November. I would like the mould removed and the bedroom made safe.`,
    files:[
      {name:'Lease agreement — excerpt.pdf', type:'PDF', detail:'6 pages · signed 2022'},
      {name:'Email to landlord.eml', type:'EML', detail:'12 Jan 2026 · notification'},
      {name:'Bedroom photos.pdf', type:'PDF', detail:'5 images · visible mould'},
      {name:'Claim intake form.pdf', type:'PDF', detail:'Submitted 7 Aug 2026'}
    ],
    facts:[
      ['Legal area','Swiss tenant-law defect dispute'],['Issue','Recurring mould and moisture'],['Landlord notified','Yes — written email provided'],['Cause','Disputed'],['Immediate risk','Possible health concern; not yet evidenced'],['Current state','Independent assessment needed']
    ],
    issues:[
      {title:'Incident dates conflict', body:'The form states 18 November; the first customer email states 10 November.', severity:'Review'},
      {title:'Health concern is unsupported', body:'Night-time coughing is reported, but no medical evidence is attached.', severity:'Conditional'},
      {title:'Cause cannot be determined yet', body:'The landlord alleges ventilation; no independent technical assessment is available.', severity:'Blocking'}
    ],
    process:[
      {title:'Confirm tenant-law scope', state:'Complete', detail:'The submission concerns a rented Basel apartment and an alleged defect.', question:'Does this concern a Swiss tenancy relationship?', why:'Scope determines whether the tenant-law defects process applies.', fact:'A lease relationship and rented dwelling are supported.', have:['Lease agreement excerpt'], need:[]},
      {title:'Check urgency', state:'Complete', detail:'Possible health concern recorded; no immediate emergency is established.', question:'Is urgent protective action needed?', why:'Immediate danger would change the order of actions.', fact:'There is a reported cough, but no evidence of acute danger.', have:['Customer statement'], need:['Medical note only if symptoms persist or worsen']},
      {title:'Confirm landlord notice', state:'Complete', detail:'Written notification is present.', question:'Was the landlord informed of the defect?', why:'The handling path depends on whether the landlord had an opportunity to respond.', fact:'The 12 January email establishes written notice.', have:['Email to landlord'], need:[]},
      {title:'Reconcile the timeline', state:'Complete', detail:'The discrepancy is visible and should be clarified in the customer request.', question:'When did the mould first appear?', why:'The date may affect the chronology, evidence assessment, and follow-up questions.', fact:'Two conflicting dates are currently recorded.', have:['Claim form','Customer email'], need:['Customer confirmation of the first observed date']},
      {title:'Establish the cause', state:'Current', detail:'The claim is blocked here.', question:'What caused the recurring mould?', why:'Responsibility and the appropriate remedy cannot be assessed until the likely cause is supported.', fact:'Whether the building, ventilation, or another condition caused the recurring mould.', have:['Photos of visible mould','Landlord ventilation allegation'], need:['Independent inspection report','Humidity or ventilation measurements','Repair cost estimate after cause is known']},

  };
  let selectedProcess = 4;

  let lastFocus = null;

  function setNav(route){
    $$('[data-route]').forEach(b=>b.setAttribute('aria-current', b.dataset.route===route?'page':'false'));

  }
  function routeTo(route){ location.hash = route.startsWith('#')?route:`#/${route}`; }
  function activeRoute(){ const h=location.hash.replace(/^#\/?/,''); return h||'new'; }

    const route=activeRoute();
    if(route==='new') renderNewClaim();

  function renderNewClaim(){
    setNav('claims');
    main.innerHTML=`<div class="page narrow">

  function renderWorkspace(id){
    const c=claims.find(x=>x.id===id)||claims[0];

    main.innerHTML=`<div class="workspace">
      <button class="back" type="button" data-action="back-claims">${icon('back')} Claims</button>
      <header class="workspace-head">
        <div><div class="eyeline">${escapeHtml(data.id)} · ${escapeHtml(c.status)}</div><h1>${escapeHtml(data.subject)}</h1><div class="meta"><span>${escapeHtml(data.customer)}</span><span>${escapeHtml(data.policy)}</span><span>${escapeHtml(data.jurisdiction)}</span><span>${escapeHtml(data.submitted)}</span></div><p class="claim-verdict">This claim is in scope. It is <strong>blocked because the cause of the recurring mould is not yet supported.</strong></p><div class="meta" style="margin-top:14px"><span>${icon('inbox',14)} Customer message + ${data.files.length} files</span><button class="btn ghost small" type="button" data-scroll="arrived">View submission</button></div></div>

      <section class="workspace-section" id="review"><div class="section-label"><h2>Expert review</h2><p>Check only the consequential decisions.</p></div><div class="review-summary"><div><h3>Three decisions need human confirmation.</h3><p>Review the current process step, the conditional medical evidence, and the targeted customer request. A saved correction stays local to this claim until repeated evidence and offline tests support a shared update.</p></div><button class="btn primary" type="button" data-action="review">Review result ${icon('arrow')}</button></div></section>
      <div class="footer-note"><span>Generated Swiss tenant-law research claim. No real-claim or customer-contact authority.</span><span>Frontend 7.0.0 · benchmark 1.2.0 · schema 2.0.0</span></div>
    </div>`;
  }

  function processStep(p,i){const cls=p.state==='Complete'?'complete':p.state==='Current'?'current':'future';return `<button type="button" class="process-step ${cls}" data-process="${i}" aria-current="${i===selectedProcess?'step':'false'}"><span class="step-mark">${p.state==='Complete'?icon('check',14):i+1}</span><span><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.detail)}</p></span></button>`}
  function processDetail(p,i){return `<div class="process-detail-top"><div><div class="eyeline">Current process question</div><h2>${escapeHtml(p.question)}</h2></div>${p.state==='Current'?'<span class="blocker-tag">Current blocker</span>':''}</div><p class="detail-intro">${escapeHtml(p.why)}</p><dl class="question-chain"><div class="chain-row"><dt>What must be established</dt><dd>${escapeHtml(p.fact)}</dd></div><div class="chain-row"><dt>Process state</dt><dd>${escapeHtml(p.state==='Complete'?'Established':p.state==='Current'?'Unresolved — blocks the next decision':'Not reached yet')}</dd></div></dl><div class="evidence-inline"><div class="evidence-group"><h3>Evidence already available</h3>${p.have.length?p.have.map(x=>`<div class="evidence-row"><span class="semantic-mark ok">${icon('check',13)}</span><div><strong>${escapeHtml(x)}</strong><small>Available in the claim package</small></div></div>`).join(''):'<p class="muted">No evidence is attached for this step.</p>'}</div><div class="evidence-group"><h3>Still needed</h3>${p.need.length?p.need.map(x=>`<div class="evidence-row"><span class="semantic-mark need">${icon('file',13)}</span><div><strong>${escapeHtml(x)}</strong><small>Needed to move this step forward</small></div></div>`).join(''):'<p class="muted">Nothing else is needed for this step.</p>'}</div></div>${p.state==='Current'?`<div class="next-action-band"><div><strong>Request the focused evidence package</strong><p>Four items resolve the timeline and technical cause without asking for unrelated documents.</p></div><button class="btn primary" type="button" data-action="prepare-request">Prepare request ${icon('arrow')}</button></div>`:''}`}
  function checklistHtml(){const groups=['Need now','Already provided','Only if needed'];return groups.map(g=>`<div class="checklist-group"><h3>${g}</h3>${northStar.checklist.filter(x=>x.group===g).map((x,i)=>{const key=x.name;const complete=x.complete||completedDocs[key];return `<div class="check-row ${complete?'complete':''}" data-doc="${escapeHtml(key)}"><button class="check-control" type="button" data-action="toggle-doc" data-doc-name="${escapeHtml(key)}" aria-label="${complete?'Mark incomplete':'Mark complete'}: ${escapeHtml(key)}">${icon('check',14)}</button><strong>${escapeHtml(x.name)}</strong><p>${escapeHtml(x.reason)}</p><button class="why-btn" type="button" data-action="why-doc" data-doc-name="${escapeHtml(key)}">Why?</button></div>`}).join('')}</div>`).join('')}
  function similarCases(){return [
    ['92%','DEF-003-E1','Recurring mould with disputed ventilation','Relevant because the landlord disputed causation and an inspection determined the next branch.'],
    ['84%','DEF-031-E1','Condensation after façade work','Relevant because recurrence began after building work and humidity evidence changed the process.'],
    ['78%','DEF-019-D1','Mould with reported child symptoms','Relevant because medical evidence remained conditional until urgency was supported.']
  ].map(x=>`<article class="similar-row"><div class="similar-score">${x[0]}</div><div><h3>${x[1]} · ${x[2]}</h3><p>${x[3]}</p></div><button class="btn small" type="button" data-action="similar-detail" data-case="${x[1]}">Open</button></article>`).join('')}

  function renderKnowledge(){setNav('knowledge');main.innerHTML=`<div class="page"><div class="knowledge-search"><h1>Ask the claim knowledge.</h1><p class="lede" style="margin:0 auto 24px">Search reviewed cases, process questions, evidence needs, and released playbook changes through one source of truth.</p><div class="search">${icon('search')}<input id="knowledgeQuery" placeholder="Which mould claims required an independent inspection?" aria-label="Search claim knowledge"></div></div><div id="knowledgeResults"><div class="knowledge-sections"><section class="knowledge-section"><h2>Process questions</h2><p>Questions that determine how claims move.</p><a class="knowledge-link" href="#/claim/DEF-003-E1">What caused recurring mould?<small>12 linked claims · 8 expert reviewed</small></a><a class="knowledge-link" href="#/claim/DEF-014-D1">Is the heating failure urgent?<small>9 linked claims · 7 expert reviewed</small></a></section><section class="knowledge-section"><h2>Evidence needs</h2><p>Documents tied to the facts they establish.</p><a class="knowledge-link" href="#/claim/NEW-BS-2026-001">Independent inspection report<small>Establishes cause, severity, and building condition</small></a><a class="knowledge-link" href="#/claim/RNT-008-D1">Official rent increase form<small>Establishes formal notice and effective date</small></a></section><section class="knowledge-section"><h2>Proposed improvements</h2><p>Expert corrections waiting for evidence and tests.</p><button class="knowledge-link" type="button" data-action="improvement-path" style="width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:transparent">Ventilation-dispute branch<small>1 of 3 supporting cases · quarantined</small></button><span class="knowledge-link">Latest released playbook<small>v1.4.0 · 28 Jul 2026</small></span></section></div></div></div>`}
  function renderSystem(){setNav('system');main.innerHTML=`<div class="page"><div class="page-title-row"><div><h1>System</h1><p class="lede">The employee workflow stays simple. Models, agents, prompts, and validators remain replaceable behind stable contracts.</p></div><button class="btn" type="button" data-action="system-audit">View release details</button></div><div class="system-list">${[
    ['Claim interpreter','Extracts supported facts and explicit unknowns from the submitted package.','Reference structured interpreter','Healthy'],
    ['Legal scope','Maps supported facts to the relevant Swiss tenant-law area.','Reference scope agent','Healthy'],
    ['Process agent','Proposes the claim-specific path from the approved claim state.','Reference process agent','Healthy'],
    ['Process validator','Rejects unreachable, unsupported, or inconsistent process states.','Deterministic validator','Healthy'],
    ['Evidence compiler','Derives document needs from reached process questions.','Deterministic compiler','Healthy'],
    ['Next-action agent','Proposes the next safe operational step.','Reference action agent','Healthy'],
    ['Knowledge consolidator','Turns repeated compatible corrections into quarantined candidates.','Governed updater','Healthy']
  ].map((m,i)=>`<div class="module-row"><div><h3>${m[0]}</h3><p>${m[1]}</p></div><div>${m[2]}</div><div class="module-status">${m[3]}</div><button class="btn small" type="button" data-action="module" data-module="${m[0]}">View contract</button></div>`).join('')}</div></div>`}
  function renderState(state){const map={loading:['Loading claims','The claim workspace is preparing the released reference data.','clock'],empty:['No claims match','Clear one filter or start a new claim.','inbox'],error:['The claim could not be opened','No canonical state was changed. Try again or open the cached reference result.','alert'],offline:['You are offline','Saved analyses remain available. Live model runs and shared updates are paused.','link'],quota:['Today’s live-analysis limit is reached','Open a saved result or queue this claim for the next available window.','clock']};const s=map[state]||map.error;main.innerHTML=`<div class="page"><div class="state-screen"><div class="state-icon">${icon(s[2],24)}</div><h1>${s[0]}</h1><p>${s[1]}</p><button class="btn primary" type="button" data-action="back-claims">Return to claims</button></div></div>`}

  function bindPage(){
    $('#newClaimForm')?.addEventListener('submit',e=>{e.preventDefault();routeTo('analysis')});
    $('#claimSearch')?.addEventListener('input',filterClaims); $('#statusFilter')?.addEventListener('change',filterClaims);
    $$('[data-process]').forEach(b=>b.addEventListener('click',()=>{selectedProcess=Number(b.dataset.process);$$('[data-process]').forEach(x=>x.setAttribute('aria-current',x===b?'step':'false'));$('#processDetail').innerHTML=processDetail(northStar.process[selectedProcess],selectedProcess);bindPage()}));
    $$('[data-action]').forEach(el=>{if(el.dataset.bound)return;el.dataset.bound='1';el.addEventListener('click',handleAction)});$$('[data-scroll]').forEach(el=>{if(el.dataset.scrollBound)return;el.dataset.scrollBound='1';el.addEventListener('click',()=>document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}))});
  }
  function filterClaims(){const q=($('#claimSearch')?.value||'').toLowerCase();const s=$('#statusFilter')?.value||'all';const rows=claims.filter(c=>(s==='all'||c.status===s)&&`${c.id} ${c.subject} ${c.preview} ${c.customer}`.toLowerCase().includes(q));$('#claimTable').innerHTML=`<div class="claim-row header"><div>Claim</div><div>Type</div><div>Files</div><div>Status</div><div>Updated</div></div>${rows.length?claimRows(rows):'<div style="padding:38px 8px;color:var(--muted)">No claims match these filters.</div>'}`}
  function handleAction(e){const a=e.currentTarget.dataset.action;lastFocus=e.currentTarget;
    if(a==='new-claim')routeTo('new'); else if(a==='back-claims')routeTo('claims'); else if(a==='add-files')toast('The four example attachments are already loaded.'); else if(a==='file-preview')openFilePreview(e.currentTarget.getAttribute('aria-label')?.replace(/^Preview /,'')||'Attachment');
    else if(a==='advanced-filters')toast('Advanced filters stay hidden until they are needed.'); else if(a==='audit'||a==='system-audit')openAudit();
    else if(a==='close-drawer')closeDrawer(); else if(a==='more')openMore(); else if(a==='prepare-request'||a==='preview-request')openRequestDraft();
    else if(a==='preview-inspection')openInspectionDraft(); else if(a==='download-request')downloadText('CasePath-customer-evidence-request.txt',requestDraft()); else if(a==='download-inspection')downloadText('CasePath-inspection-brief.txt',inspectionDraft());
    else if(a==='toggle-doc'){const name=e.currentTarget.dataset.docName;completedDocs[name]=!completedDocs[name];storage.set('casepath-v7-docs',completedDocs);const row=e.currentTarget.closest('.check-row');row.classList.toggle('complete',completedDocs[name]);e.currentTarget.setAttribute('aria-label',`${completedDocs[name]?'Mark incomplete':'Mark complete'}: ${name}`);toast(`${name} marked ${completedDocs[name]?'complete':'outstanding'}.`)}
    else if(a==='why-doc')openWhy(e.currentTarget.dataset.docName); else if(a==='review')openReview(); else if(a==='improvement-path')openImprovement(); else if(a==='similar-detail')openSimilar(e.currentTarget.dataset.case); else if(a==='module')openModule(e.currentTarget.dataset.module); else if(a==='save-review')saveReview();
  }

  function openDrawer(title,body,foot=''){lastFocus=document.activeElement;$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=body;$('#drawerFoot').innerHTML=foot;$('#drawer').classList.add('open');$('#drawerBackdrop').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>$('#drawer [data-action="close-drawer"]')?.focus(),30);$$('#drawer [data-action]').forEach(el=>{if(el.dataset.bound)return;el.dataset.bound='1';el.addEventListener('click',handleAction)})}
  function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBackdrop').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');document.body.style.overflow='';lastFocus?.focus?.()}
  function openAudit(){openDrawer('Audit trail',`<p style="color:var(--muted);margin-bottom:28px">One trace shows how the submitted package became the accepted claim state. Technical detail remains separate from the employee workflow.</p>${[
      ['1','Source input','Customer message and 4 attachment records were allowlisted. Hidden reference fields removed: 0.','claim.interpretation/2.1','42 ms'],
      ['2','Fact proposal','The interpreter proposed 16 facts with source references; 2 remained conflicting and 4 unknown.','reference-interpreter/7','486 ms'],
      ['3','Legal scope','Swiss tenant-law defects scope proposed from lease relationship, property, and alleged defect.','scope-agent/4','311 ms'],
      ['4','Process proposal','A seven-step claim-specific path was proposed; the causation step remained unresolved.','process-agent/9','714 ms'],
      ['5','Deterministic validation','Graph reachability, evidence ownership, and unknown-preservation checks passed.','process-validator/6','18 ms'],
      ['6','Accepted result','The canonical process, checklist, next action, and safety flags were saved.','claim-state/2.0','9 ms']
    ].map(x=>`<div class="audit-stage"><span class="audit-mark">${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p><div class="audit-meta"><span>${x[3]}</span><span>${x[4]}</span><span>prompt v3.2</span></div></div></div>`).join('')}<details><summary>Structured accepted output</summary><pre>${escapeHtml(JSON.stringify({claim_id:northStar.id,scope:'Swiss tenant-law defect dispute',category:'mould_moisture',current_step:'establish_cause',unresolved:['incident_start_date','mould_cause','health_impact'],next_action:'request_targeted_evidence',validation:'passed'},null,2))}</pre></details><details><summary>Model and provider</summary><pre>${escapeHtml(JSON.stringify({profile:'reference-process-grounded',provider:'released reference result',live_model:'optional visitor-authorized OpenRouter profile',prompt_version:'3.2.0',schema_version:'2.0.0',fallback:'deterministic playbook + expert escalation'},null,2))}</pre></details>`)}
  function openMore(){openDrawer('Claim actions',`<div class="system-list"><button class="knowledge-link" type="button" data-action="review">Review result<small>Correct the small number of consequential decisions</small></button><button class="knowledge-link" type="button" data-action="audit">View audit trail<small>Inspect models, prompts, evidence, validation, and provenance</small></button><button class="knowledge-link" type="button" data-action="download-request">Download run summary<small>Export the current generated demonstration record</small></button></div>`)}
  function openFilePreview(name){openDrawer(name,`<div class="eyeline">Safe generated preview</div><h2 style="font-size:31px">${escapeHtml(name)}</h2><p class="detail-intro">This demonstration shows the attachment metadata and the specific evidence the system used. Original bytes remain outside the normal product view.</p><dl class="question-chain"><div class="chain-row"><dt>Observed content</dt><dd>${name.includes('Email')?'Written notice to the landlord dated 12 January 2026.':name.includes('photo')||name.includes('Photo')?'Five bedroom images showing visible mould near the outer wall.':name.includes('Lease')?'Lease excerpt identifying the parties, property, and tenancy relationship.':'Customer-submitted claim details and incident chronology.'}</dd></div><div class="chain-row"><dt>Use in the claim</dt><dd>Only supported facts are extracted; conflicting or absent information stays unresolved.</dd></div></dl>`)}
  function openWhy(name){const item=northStar.checklist.find(x=>x.name===name);const step=northStar.process[item?.step||0];openDrawer(`Why ${name}?`,`<div class="eyeline">Process question</div><h2 style="font-size:31px">${escapeHtml(step.question)}</h2><p class="detail-intro">${escapeHtml(item.reason)}</p><dl class="question-chain"><div class="chain-row"><dt>Fact it supports</dt><dd>${escapeHtml(step.fact)}</dd></div><div class="chain-row"><dt>Current status</dt><dd>${item.complete?'Already provided and sufficient':item.group==='Only if needed'?'Conditional — request only when the stated condition applies':'Still needed'}</dd></div><div class="chain-row"><dt>What it unlocks</dt><dd>${escapeHtml(step.title)}</dd></div></dl>`, `<button class="btn" type="button" data-action="close-drawer">Close</button>`)}
  function openRequestDraft(){openDrawer('Customer evidence request',`<p style="color:var(--muted)">Editable draft · generated from the current process blocker</p><div class="field"><label for="requestDraft">Draft</label><textarea id="requestDraft" style="min-height:520px">${escapeHtml(requestDraft())}</textarea></div>`,`<button class="btn" type="button" data-action="download-request">${icon('download')} Download</button><button class="btn primary" type="button" data-action="review">Review before use</button>`)}
  function openInspectionDraft(){openDrawer('Independent inspection brief',`<p style="color:var(--muted)">Prepared from supported claim facts only.</p><div class="field"><label for="inspectionDraft">Draft</label><textarea id="inspectionDraft" style="min-height:520px">${escapeHtml(inspectionDraft())}</textarea></div>`,`<button class="btn" type="button" data-action="download-inspection">${icon('download')} Download</button>`)}
  function openReview(){openDrawer('Review the result',`<p style="color:var(--muted)">Confirm only the decisions that can change the handling path or customer request.</p><form class="review-form" id="reviewForm"><div class="decision-row"><div><h3>Relevant legal area</h3><p>Swiss tenant-law defect dispute</p></div><select name="scope"><option>Approve</option><option>Change</option><option>Escalate</option></select></div><div class="decision-row"><div><h3>Current process step</h3><p>Establish the cause through an independent assessment</p></div><select name="process"><option>Approve</option><option>Change</option><option>Escalate</option></select></div><div class="decision-row"><div><h3>Medical evidence</h3><p>Conditional only if symptoms persist, worsen, or change urgency</p></div><select name="medical"><option>Approve</option><option>Request now</option><option>Remove</option></select></div><div class="decision-row"><div><h3>Customer request</h3><p>Four targeted items; no generic category checklist</p></div><select name="request"><option>Approve</option><option>Edit</option><option>Reject</option></select></div><div class="field" style="margin-top:24px"><label for="reviewNote">Reason or correction</label><textarea id="reviewNote" placeholder="Explain any change so it becomes structured evidence."></textarea></div><div class="field"><label for="reviewConfidence">Confidence</label><select id="reviewConfidence"><option>High</option><option>Medium</option><option>Low</option></select></div></form>`,`<button class="btn" type="button" data-action="close-drawer">Cancel</button><button class="btn primary" type="button" data-action="save-review">Save review</button>`)}
  function saveReview(){storage.set('casepath-v7-review',{claim:northStar.id,savedAt:new Date().toISOString(),note:$('#reviewNote')?.value||'',confidence:$('#reviewConfidence')?.value||'High'});closeDrawer();toast('Review saved for this claim. Shared knowledge has not changed.','View improvement path',openImprovement)}

    ['1','Expert correction','Saved for NEW-BS-2026-001.'],['2','Supporting pattern','1 of 3 compatible reviewed claims.'],['3','Proposed change','No shared change is created yet.'],['4','Offline tests','Target and protected regression tests are pending support.'],['5','Approval','A process owner must approve any released playbook version.']
  ].map(x=>`<div class="audit-stage"><span class="audit-mark">${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join('')}`)}
  function openSimilar(id){openDrawer(id,`<div class="eyeline">Why this case is relevant</div><h2 style="font-size:31px">A similar process question, not a copied answer.</h2><p class="detail-intro">This reviewed case involved recurring mould, disputed causation, and missing technical evidence. It supports the need to resolve the cause before responsibility, but its customer-specific facts remain separate.</p><dl class="question-chain"><div class="chain-row"><dt>Shared pattern</dt><dd>Recurring mould + disputed cause + no independent report</dd></div><div class="chain-row"><dt>Different facts</dt><dd>Different property, chronology, attachments, and health allegations</dd></div><div class="chain-row"><dt>Use in this run</dt><dd>Retrieved as precedent; no fields copied into canonical state</dd></div></dl>`)}
  function openModule(name){openDrawer(`${name} contract`,`<div class="eyeline">Replaceable module</div><h2 style="font-size:31px">${escapeHtml(name)}</h2><p class="detail-intro">The employee workspace consumes canonical inputs and outputs. The implementation can change without changing the claim, process, checklist, review, or evaluation contracts.</p><dl class="question-chain"><div class="chain-row"><dt>Input</dt><dd>Versioned canonical claim state and permitted context</dd></div><div class="chain-row"><dt>Output</dt><dd>Schema-valid proposal with evidence references and provenance</dd></div><div class="chain-row"><dt>Safety boundary</dt><dd>Deterministic validation before canonical state changes</dd></div><div class="chain-row"><dt>Failure</dt><dd>Recorded fallback or expert escalation; never silent</dd></div></dl>`)}
  function requestDraft(){return `Subject: Information needed to assess your mould claim\n\nDear Anna Keller,\n\nThank you for the documents you sent. We can confirm the tenancy relationship, the written notification to the landlord, and the visible mould in the bedroom.\n\nTo determine the likely cause and the appropriate next step, please provide:\n\n1. An independent inspection report covering the cause, severity, and building condition.\n2. Any humidity or ventilation measurements available for the bedroom.\n3. A short confirmation of when you first observed the mould: 10 November or 18 November.\n4. A repair cost estimate once the likely cause has been identified.\n\nA medical note is not required at this stage. Please tell us immediately if the reported symptoms worsen or require urgent treatment.\n\nKind regards,\nClaim handling team\n\nGenerated draft for expert review. Do not send without approval.`}
  function inspectionDraft(){return `Independent inspection brief\n\nClaim: ${northStar.id}\nProperty: rented apartment, Basel-Stadt\nAffected area: bedroom\n\nSupported facts\n- Recurring visible mould is shown in the submitted photographs.\n- The customer notified the landlord in writing on 12 January 2026.\n- The landlord attributes the problem to insufficient ventilation.\n- The customer reports recurrence after façade work in October.\n\nQuestions for the inspection\n1. What is the most likely cause of the recurring mould?\n2. Do the wall, insulation, thermal bridge, or other building conditions contribute?\n3. Are humidity and ventilation patterns consistent with the landlord’s allegation?\n4. What remediation is required and how urgent is it?\n5. Which measurements, photographs, and observations support the conclusion?\n\nGenerated brief for expert review.`}
  function fileRow(f){return `<div class="file-row"><span class="file-type">${escapeHtml(f.type)}</span><div><strong>${escapeHtml(f.name)}</strong><small>${escapeHtml(f.detail)}</small></div><button class="btn icon-btn ghost" type="button" data-action="file-preview" aria-label="Preview ${escapeHtml(f.name)}">${icon('eye')}</button></div>`}
  function downloadText(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast(`${name} downloaded.`)}
  function toast(text,actionText,action){const t=$('#toast');$('#toastText').textContent=text;const b=$('#toastAction');if(actionText){b.hidden=false;b.textContent=actionText;b.onclick=()=>{action?.();t.classList.remove('show')}}else{b.hidden=true;b.onclick=null}t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),4500)}
  function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
  function downloadKeyboard(e){if(e.key==='Escape'&&$('#drawer').classList.contains('open'))closeDrawer()}
  document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){e.preventDefault();routeTo(r.dataset.route)}});
  document.addEventListener('keydown',downloadKeyboard);
  $('#drawerBackdrop').addEventListener('click',closeDrawer);
  $$('[data-mobile-icon="claims"]').forEach(x=>x.innerHTML=icon('inbox'));$$('[data-mobile-icon="knowledge"]').forEach(x=>x.innerHTML=icon('book'));$$('[data-mobile-icon="system"]').forEach(x=>x.innerHTML=icon('gear'));
  $('[data-action="close-drawer"]').innerHTML=icon('back');
  window.addEventListener('hashchange',render);
  if(!location.hash)location.hash='#/new';else render();
})();
</script>
</body>
</html>
