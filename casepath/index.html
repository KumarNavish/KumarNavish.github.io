function overview(c){return `${summaryStrip(c)}<div class="grid two"><div class="stack"><section class="card"><div class="card-head"><div><h2>What arrived</h2><p>The observable customer submission only</p></div><span class="badge info">${c.attachments.length} files</span></div><div class="card-body"><div class="message">${esc(c.message)}</div><h3 style="font-size:13px;margin:16px 0 8px">Attachments</h3><div class="attachments">${c.attachments.length?c.attachments.map(a=>`<div class="attachment"><div class="fileicon">${a[0].split('.').pop().toUpperCase()}</div><div><strong>${esc(a[0])}</strong><small>${esc(a[1])} · generated safe preview</small></div><span class="status ${a[2]}" style="margin-left:auto">${a[2]}</span></div>`).join(''):'<div class="muted">No attachments in the first submission.</div>'}</div></div></section><section class="card pad"><div class="next-action"><div class="arrowbox">→</div><div><div class="eyebrow">Recommended next action</div><strong>${esc(c.next)}</strong><p>Derived from the first unresolved process question, not from a generic category checklist.</p></div></div></section></div><div class="stack"><section class="card"><div class="card-head"><div><h2>What the system understands</h2><p>Accepted canonical state after deterministic checks</p></div><button class="linkbtn" onclick="setTab('audit')">Inspect trail</button></div><div class="card-body"><div class="grid two"><div><div class="eyebrow">Legal scope</div><h3 style="margin:5px 0">${esc(c.scope)}</h3><p class="muted" style="font-size:12px">${esc(c.scopeState)} · ${esc(c.dispute)}</p></div><div><div class="eyebrow">Current blocker</div><h3 style="margin:5px 0">${esc(c.current)}</h3><p class="muted" style="font-size:12px">${esc(c.blocker)}</p></div></div><h3 style="font-size:13px;margin:16px 0 8px">Unresolved controlling facts</h3><div class="fact-list">${c.unresolved.map(f=>`<div class="fact unknown"><div class="state">Unknown</div><div><strong>${human(f)}</strong><div class="subline">No admissible evidence currently resolves this fact.</div></div></div>`).join('')}</div></div></section><div class="callout amber"><h3>Safety warning</h3><p>${esc(c.warning)}</p></div><section class="card"><div class="card-head"><div><h2>Handling process</h2><p>The claim-specific path is the centre of the decision</p></div><button class="linkbtn" onclick="setTab('process')">Open process</button></div><div class="card-body">${processGraph(c,true)}</div></section></div></div><div class="grid four" style="margin-top:14px"><div class="card kpi"><div class="label">Simulated contact rounds</div><div class="value">${c.metrics.rounds}</div><div class="detail">Transparent assumption, not observed impact</div></div><div class="card kpi"><div class="label">Generic requests avoided</div><div class="value">${c.metrics.avoided}</div><div class="detail">Versus category-level checklist</div></div><div class="card kpi"><div class="label">Critical evidence identified</div><div class="value">${c.metrics.critical}</div><div class="detail">Generated-reference diagnostic</div></div><div class="card kpi"><div class="label">Estimated review time</div><div class="value" style="font-size:20px">${c.metrics.time}</div><div class="detail">Simulation for usability testing</div></div></div>`}
function processGraph(c,compact=false){let nodes=compact?c.process.slice(0,5):c.process;return `<div class="process-wrap"><div class="process">${nodes.map((n,i)=>`<div class="node ${n[1]} ${state.node===i?'selected':''}"><button onclick="selectNode(${i})" aria-label="${esc(n[0])}, ${n[1]}"><div class="node-dot">${n[1]==='complete'?'✓':i+1}</div><div class="node-title">${esc(n[0])}</div><div class="node-state">${n[1]}</div></button></div>`).join('')}</div></div>`}
function selectNode(i){state.node=i;state.tab='process';render();setTimeout(()=>$('#nodeDetail')?.scrollIntoView({behavior:'smooth',block:'center'}),10)}
function processView(c){let idx=state.node??Math.max(0,c.process.findIndex(n=>n[1]==='current'));let n=c.process[idx];let related=c.docs.filter(d=>d[2]===n[0]);return `<div class="card"><div class="card-head"><div><h2>Claim-specific handling process</h2><p>Completed, current, blocked and inactive steps remain distinguishable.</p></div><span class="badge warn">Current: ${esc(c.current)}</span></div><div class="card-body">${processGraph(c)}</div></div><div id="nodeDetail" class="grid two" style="margin-top:14px"><div class="card pad"><div class="eyebrow">Selected process step</div><h2 style="margin:6px 0">${esc(n[0])}</h2><div class="node-detail"><div class="eyebrow">Controlling question</div><div class="question">${n[1]==='current'?esc(c.blocker):questionFor(n[0],c)}</div></div><h3 style="font-size:13px;margin:17px 0 8px">Evidence available</h3><div class="fact-list">${related.length?related.map(d=>`<div class="fact ${d[1]==='present'?'known':'unknown'}"><div class="state">${esc(d[1])}</div><div><strong>${esc(d[0])}</strong><div class="subline">${esc(d[3])}</div></div></div>`).join(''):'<div class="muted">No evidence item is owned by this step in the generated reference.</div>'}</div></div><div class="card pad"><div class="eyebrow">Why this step matters</div><h2 style="margin:6px 0 10px">It controls what may happen next</h2><p class="muted">The checklist is not predicted independently. Only documents connected to a reached process question may become current evidence needs.</p><div class="callout blue" style="margin-top:14px"><h3>Current downstream effect</h3><p>${n[1]==='current'?esc(c.next):`This ${n[1]} step does not currently control the next action.`}</p></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="state.tab='documents';render()">Show linked documents</button><button class="btn" onclick="state.tab='audit';render()">Inspect producing agent</button></div></div></div>`}
function documentsView(c){return `<div class="page-head"><div><div class="eyebrow">Process-derived checklist</div><h1 style="font-size:23px">Every document has a reason and an owning step</h1><p>Present, insufficient, missing, conditional and not-applicable states remain separate.</p></div></div><div class="card"><div class="card-head"><div><h2>Evidence needs</h2><p>Select an item to jump to the process step it supports.</p></div><span class="badge info">${c.docs.filter(d=>d[1]==='missing').length} missing now</span></div><div class="card-body"><div class="doc-list">${c.docs.map((d,i)=>`<div class="doc ${state.doc===i?'selected':''}" onclick="selectDoc(${i})"><div><div class="doc-name">${esc(d[0])}</div><div class="subline">${esc(d[4])}</div></div><div><span class="status ${d[1]==='not applicable'?'na':d[1]}">${esc(d[1])}</span></div><div><span class="badge info">${esc(d[2])}</span></div><div class="doc-reason">${esc(d[3])}</div><button class="linkbtn" aria-label="Open process step ${esc(d[2])}">Open step</button></div>`).join('')}</div></div></div><div class="grid two" style="margin-top:14px"><div class="callout green"><h3>No repeated request</h3><p>A document already present in the observable package cannot be requested again. Present-but-insufficient evidence is routed to review rather than mislabelled missing.</p></div><div class="callout blue"><h3>Applicability is not availability</h3><p>A document can be applicable yet missing, or present yet insufficient. The two decisions are evaluated separately.</p></div></div>`}
function selectDoc(i){const c=claims.find(x=>x.id===state.claimId);state.doc=i;let step=c.docs[i][2];state.node=c.process.findIndex(n=>n[0]===step);state.tab='process';render();setTimeout(()=>$('#nodeDetail')?.scrollIntoView({behavior:'smooth',block:'center'}),10)}
function auditEntries(c){return stageNames.map((s,i)=>({s,agent:i===0?'Claim Interpretation Agent':i===1?'Legal Scope Agent':i===3?'Process Identification Agent':i===5?'Checklist Compiler':i===6?'Next-Action Agent':'Deterministic validator',model:i<4?'Cached reference / Nemotron-compatible':'No model call',prompt:i<4?`casepath.${s.toLowerCase().replaceAll(' ','_')}.v3`:'none',tools:i===1?'approved-source registry':i===3?'process playbook retrieval':i===5?'document registry':'schema validator',latency:[184,92,21,236,8,14,11,7][i],tokens:i<4?[812,391,0,622][i]:0,result:i===4||i===7?'passed':'accepted',output:i===0?{category:c.category,subcategory:c.subcategory,unresolved:c.unresolved}:i===1?{scope:c.scope,state:c.scopeState}:i===3?{current:c.current,question:c.blocker}:i===5?{documents:c.docs.map(d=>({name:d[0],status:d[1],node:d[2]}))}:i===6?{next_action:c.next}:{validator:'passed'}}))}
function auditView(c){let last=runs().filter(r=>r.claimId===c.id).at(-1);return `<div class="card"><div class="card-head"><div><h2>One audit trail for the whole claim</h2><p>Technical detail is hidden until a transformation is opened.</p></div>${last?`<span class="badge ok">Run ${esc(last.runId)}</span>`:'<span class="badge info">Released reference trace</span>'}</div><div class="card-body"><div class="timeline">${auditEntries(c).map((e,i)=>`<div class="timeline-item" id="audit-${i}"><div class="timeline-icon">${i+1}</div><div class="timeline-content"><div class="timeline-summary"><div><div class="timeline-title">${esc(e.s)}</div><div class="timeline-meta">${esc(e.agent)} · ${e.latency} ms · ${e.result}</div></div><button onclick="toggleAudit(${i})">Inspect</button></div><div class="timeline-detail"><div class="keyvals"><div class="keyval"><span>Model</span><strong>${esc(e.model)}</strong></div><div class="keyval"><span>Prompt</span><strong>${esc(e.prompt)}</strong></div><div class="keyval"><span>Tool / validator</span><strong>${esc(e.tools)}</strong></div><div class="keyval"><span>Tokens</span><strong>${e.tokens}</strong></div><div class="keyval"><span>Retries</span><strong>0</strong></div><div class="keyval"><span>Fallback</span><strong>${i<4?'cached reference if unavailable':'fail closed'}</strong></div></div><h4>Accepted structured output</h4><div class="code">${esc(JSON.stringify(e.output,null,2))}</div></div></div></div>`).join('')}</div></div></div>`}
function toggleAudit(i){$('#audit-'+i)?.classList.toggle('open')}
function reviewView(c){let previous=reviews().filter(r=>r.claimId===c.id).at(-1);return `<div class="grid two"><div class="card"><div class="card-head"><div><h2>Expert review</h2><p>Review the handling decision, not framework internals.</p></div>${previous?'<span class="badge ok">Local review saved</span>':'<span class="badge warn">Not reviewed</span>'}</div><div class="card-body"><div class="review-choice">${[['approve','Approve'],['edit','Approve with edits'],['alternative','Alternative valid plan'],['escalate','Escalate uncertainty']].map(([v,n])=>`<button class="choice ${state.reviewChoice===v?'active':''}" onclick="state.reviewChoice='${v}';render()"><strong>${n}</strong><small>${v==='approve'?'No material change':v==='edit'?'Record structured corrections':v==='alternative'?'Preserve more than one safe path':'Professional disagreement or missing authority'}</small></button>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="field"><label for="scopeEdit">Scope decision</label><select id="scopeEdit"><option>${esc(c.scopeState)}</option><option>in scope</option><option>out of scope</option><option>uncertain</option></select></div><div class="field"><label for="stepEdit">Current process step</label><select id="stepEdit">${c.process.map(n=>`<option ${n[0]===c.current?'selected':''}>${esc(n[0])}</option>`).join('')}</select></div><div class="field"><label for="docEdit">Document correction</label><select id="docEdit"><option value="">No document change</option>${c.docs.map(d=>`<option>${esc(d[0])}: ${esc(d[1])}</option>`).join('')}</select></div><div class="field"><label for="confidence">Reviewer confidence</label><select id="confidence"><option>high</option><option selected>medium</option><option>low</option></select></div></div><div class="field" style="margin-top:12px"><label for="justification">Operational or legal justification</label><textarea id="justification" placeholder="Explain what should change, why, and what evidence or authority supports it.">${previous?esc(previous.justification):''}</textarea></div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="saveReview('${c.id}')">Save structured review</button><button class="btn" onclick="exportReview('${c.id}')">Download correction</button></div></div></div><div class="stack"><div class="callout blue"><h3>What the expert is validating</h3><p>Scope, process path, current step, unresolved facts, document requirements, next action, uncertainty and acceptable alternatives.</p></div><div class="card pad"><div class="eyebrow">Current proposal</div><h2 style="margin:6px 0">${esc(c.current)}</h2><p class="muted">${esc(c.blocker)}</p><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="eyebrow">Next action</div><strong>${esc(c.next)}</strong></div><div class="callout amber"><h3>One correction stays local</h3><p>A saved review re-executes this case locally. Shared knowledge remains quarantined until repeated compatible evidence and offline safety gates support a versioned update.</p></div></div></div>`}
function saveReview(id){let c=claims.find(x=>x.id===id);let r={contract:'casepath.expert-correction/3.0',reviewId:'REV-'+Date.now(),claimId:id,claimVersion:'public-generated-v1',decision:state.reviewChoice,scope:$('#scopeEdit')?.value,currentStep:$('#stepEdit')?.value,documentEdit:$('#docEdit')?.value,confidence:$('#confidence')?.value,justification:$('#justification')?.value||'',createdAt:new Date().toISOString(),sharedKnowledgeChanged:false,candidateStatus:'quarantined',support:{current:1,required:3}};let all=reviews();all.push(r);localStorage.setItem('cp_reviews',JSON.stringify(all));toast('Structured review saved locally. Shared knowledge was not changed.');state.tab='knowledge';render()}
function exportReview(id){let r=reviews().filter(x=>x.claimId===id).at(-1);if(!r)return toast('Save a review first.');downloadJSON(`casepath-correction-${id}.json`,r)}
function knowledgeImpact(c){let r=reviews().filter(x=>x.claimId===c.id).at(-1);return `<div class="page-head"><div><div class="eyebrow">Safe learning path</div><h1 style="font-size:24px">A correction becomes inspectable knowledge—not an instant rule</h1><p>Every transition is visible, testable, versioned and reversible.</p></div></div><div class="path">${[['1','Expert correction'],['2','Structured record'],['3','Pattern support'],['4','Candidate update'],['5','Offline tests'],['6','Approval gate'],['7','Version / rollback']].map(x=>`<div class="path-step"><div class="n">${x[0]}</div><strong>${x[1]}</strong><small>${x[0]==='3'?'1 / 3 supporting cases':x[0]==='4'?'Quarantined':x[0]==='5'?'Target + protected sets':x[0]==='6'?'Human decision':'Inspectable'}</small></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="card pad"><div class="eyebrow">Current case-local record</div><h2 style="margin:6px 0">${r?esc(r.decision):'No expert review saved yet'}</h2>${r?`<p class="muted">${esc(r.justification||'No justification supplied.')}</p><div class="keyvals"><div class="keyval"><span>Status</span><strong>Quarantined</strong></div><div class="keyval"><span>Support</span><strong>1 / 3 claims</strong></div><div class="keyval"><span>Shared effect</span><strong>None</strong></div></div>`:`<p class="muted">Open Expert review to create a structured correction.</p><button class="btn" onclick="setTab('review')">Review this case</button>`}</div><div class="card pad"><div class="eyebrow">Candidate knowledge change</div><h2 style="margin:6px 0">Recurring mould + disputed ventilation</h2><p class="muted">Proposed branch hypothesis: when recurring condensation and a relevant landlord ventilation allegation are both supported, require an independent technical assessment before the remedy branch.</p><span class="badge warn">Quarantined · not executable</span></div></div><div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Before and after a governed release</h2><p>Illustrative generated example; no real playbook update has been authorized.</p></div></div><div class="card-body"><div class="change"><div class="before"><div class="eyebrow">Before candidate</div><h3>Generic cause assessment</h3><p class="muted">The process pauses but does not distinguish the disputed-ventilation pattern.</p></div><div class="change-arrow">→</div><div class="after"><div class="eyebrow">After approved version</div><h3>Independent technical assessment branch</h3><p class="muted">Only claims satisfying the reviewed conditions receive the new evidence path. Protected claims remain unchanged.</p></div></div></div></div>`}
function knowledgePage(){return `<div class="page-head"><div><div class="eyebrow">Claim-handling knowledge</div><h1>Search questions, evidence needs and governed changes</h1><p>Humans and agents use the same canonical knowledge identifiers. Generated references remain clearly separated from expert-approved knowledge.</p></div><div class="actions"><button class="btn" onclick="downloadJSON('casepath-public-knowledge.json',knowledge)">Download knowledge</button></div></div><div class="card pad knowledge-search"><div class="search-wrap"><input id="knowledgeSearch" class="search" placeholder="Ask: Which mould claims need a technical inspection?" oninput="renderKnowledge(this.value)" aria-label="Search knowledge"></div><div class="fineprint" style="margin-top:7px">Try: “disputed causation”, “heating evidence”, “unvalidated legal sources”, or “which update changed the checklist”.</div></div><div id="knowledgeResults" class="knowledge-results">${knowledgeCards(knowledge)}</div>`}
function knowledgeCards(items){return items.map(k=>`<article class="card knowledge-item"><div class="type">${esc(k.type)}</div><h3>${esc(k.title)}</h3><p>${esc(k.body)}</p><div class="meta" style="margin-top:10px">${k.tags.slice(0,3).map(t=>`<span class="badge info">${esc(t)}</span>`).join('')}</div>${k.claims.length?`<div style="margin-top:10px">${k.claims.map(id=>`<button class="linkbtn" onclick="selectClaim('${id}')">${id}</button>`).join('')}</div>`:''}</article>`).join('')}
function renderKnowledge(q){let stop=new Set(['which','what','the','a','an','need','needs','required','cases','claims','are','is','for','with','that','this','changed']);let terms=q.toLowerCase().split(/\W+/).filter(x=>x.length>2&&!stop.has(x));let scored=knowledge.map(k=>{let hay=[k.type,k.title,k.body,...k.tags,...k.claims].join(' ').toLowerCase();return [k,terms.reduce((s,t)=>s+(hay.includes(t)?1:0),0)]}).filter(x=>!terms.length||x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);$('#knowledgeResults').innerHTML=scored.length?knowledgeCards(scored):'<div class="empty card" style="grid-column:1/-1">No knowledge item matches that question.</div>'}
function systemPage(){return `<div class="page-head"><div><div class="eyebrow">Swappable intelligence</div><h1>Pipeline configuration</h1><p>Replace language-dependent components without changing claim schemas, deterministic validators, the interface or evaluation contracts.</p></div><div class="actions"><button class="btn" onclick="openOpenRouter()">Connect OpenRouter</button><button class="btn" onclick="runConformance()">Run conformance check</button></div></div><h2 style="font-size:17px">Reference profiles</h2><div class="grid three" style="margin-bottom:22px">${Object.entries(profiles).map(([id,p])=>`<div class="profile-card ${state.profile===id?'active':''}"><div class="eyebrow">${p.kind}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="profile-stats"><span><strong>${esc(p.latency)}</strong>Latency</span><span><strong>${esc(p.cost)}</strong>Cost</span><span><strong>${esc(p.score)}</strong>Status</span></div><button class="btn small" style="margin-top:12px" onclick="state.profile='${id}';render()">${state.profile===id?'Selected':'Select profile'}</button></div>`).join('')}</div><div class="card"><div class="card-head"><div><h2>Module contracts</h2><p>Select a module to inspect its replacement boundary.</p></div><span class="badge info">${modules.length} swap points</span></div><div class="card-body"><div class="grid three">${modules.map((m,i)=>`<article class="module card"><div class="module-head"><div class="module-icon">${i+1}</div><div><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p></div></div><dl><dt>Input</dt><dd>${esc(m[2])}</dd><dt>Output</dt><dd>${esc(m[3])}</dd><dt>Validator</dt><dd>${esc(m[4])}</dd></dl><button class="linkbtn" style="margin-top:9px" onclick="openModule(${i})">Replace this module</button></article>`).join('')}</div></div></div>`}
function helpPage(){return `<div class="page-head"><div><div class="eyebrow">Product guide</div><h1>Understand CasePath in five minutes</h1><p>The interface uses the same language as the research contracts.</p></div></div><div class="grid two"><div class="card pad"><h2>What CasePath does</h2><p>It converts the first customer message and observable attachments into a sourced claim state, follows an approved process to the first unresolved controlling question, and derives the evidence and next action from that question.</p><div class="code">Observable Claim Package\n→ Canonical Claim State\n→ Claim-specific process\n→ First actionable blocker\n→ Process-derived checklist\n→ Next safe action</div></div><div class="card pad"><h2>What it does not do</h2><ul><li>Give legal advice</li><li>Calculate deadlines</li><li>Decide insurance coverage</li><li>Send customer messages</li><li>Change shared playbooks from one correction</li><li>Process real claims on this public site</li></ul></div><div class="card pad"><h2>How to evaluate the value</h2><ol><li>Open a claim and identify the current blocker.</li><li>Select a missing document and verify its process reason.</li><li>Open the audit trail and inspect the accepted output.</li><li>Compare the process-grounded profile with the static baseline.</li><li>Record a correction and inspect the quarantine path.</li></ol></div><div class="card pad"><h2>Research and extension</h2><p>Each module exposes stable input, output, tool, timeout, fallback and provenance requirements. A replacement may use Python, HTTP or MCP transport, but it must pass deterministic conformance before evaluation.</p><button class="btn" onclick="nav('system')">Open module contracts</button></div></div>`}
function human(x){return x.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase())}
function questionFor(step,c){let map={'Intake':'Is the observable submission complete enough to begin?','Urgency':'Is immediate human triage required?','Urgent triage':'Is immediate human triage required?','Notice':'Has the responsible party been informed?','Response check':'Has a response or inspection been arranged?','Cause assessment':'What is the probable cause?','Remedy':'Which handling option is supported?','Monitoring':'Has the agreed action resolved the issue?','Scope':'Does the concern enter the supported tenant-law workflow?','Notice validity':'Is the complete notice observable?','Grounds review':'What factual basis is stated?','Retention reason':'What documented reason supports retention?','Amount check':'What amount and evidence are claimed?','Underlying records':'Are the source records available?','Initial guidance':'What factual record should be preserved before a dispute exists?'};return map[step]||`What must be established at ${step.toLowerCase()}?`}
function guidedDemo(){selectClaim('DEF-031');setTimeout(()=>runClaim('DEF-031'),100)}
async function runClaim(id){const c=claims.find(x=>x.id===id);let profile=$('#profileSelect')?.value||state.profile;state.profile=profile;if(profile==='live'){let key=sessionStorage.getItem('cp_openrouter_key');if(!key)return openOpenRouter()}showProgress(c,profile);let liveOutput=null,error=null;try{if(profile==='live')liveOutput=await runLive(c)}catch(e){error=e.message}await sleep(profile==='live'?300:1500);finishProgress();let run={contract:'casepath.run-bundle/4.0',runId:'RUN-'+Date.now(),claimId:id,claimVersion:'generated-public-v1',benchmarkVersion:RELEASE.benchmark,profile,model:profile==='live'?RELEASE.model:profile==='static'?'none':'cached-reference',provider:profile==='live'?'OpenRouter':'local',createdAt:new Date().toISOString(),observableInput:{message:c.message,attachments:c.attachments.map(a=>a[0])},accepted:{scope:c.scope,category:c.category,subcategory:c.subcategory,currentStep:c.current,unresolvedFacts:c.unresolved,documents:c.docs,nextAction:c.next},liveProposal:liveOutput,providerError:error,validation:{schema:'passed',graph:'passed',checklist:'passed',safety:'human approval required'},metrics:{simulated:c.metrics},review:reviews().filter(r=>r.claimId===id).at(-1)||null};let all=runs();all.push(run);localStorage.setItem('cp_runs',JSON.stringify(all));toast(error?'Provider failed safely; deterministic reference output is shown.':'Analysis complete. Open Audit trail to inspect every stage.');state.tab='overview';render()}
function showProgress(c,profile){let p=$('#progress');p.classList.add('open');p.innerHTML=`<div class="progress-card"><h2 id="progressTitle">Analysing ${esc(c.id)}</h2><p>${esc(profiles[profile].name)} · proposals cannot bypass deterministic validation</p><div class="progressbar"><div id="bar"></div></div><div class="stages">${stageNames.map((s,i)=>`<div id="stage-${i}" class="stage"><span class="dot"></span>${s}</div>`).join('')}</div></div>`;let i=0;window.cpTimer=setInterval(()=>{if(i>0)$('#stage-'+(i-1))?.classList.replace('active','done');if(i<stageNames.length){$('#stage-'+i)?.classList.add('active');$('#bar').style.width=((i+1)/stageNames.length*100)+'%';i++}else clearInterval(window.cpTimer)},140)}
function finishProgress(){clearInterval(window.cpTimer);$('#progress').classList.remove('open')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function quota(){let d=new Date().toISOString().slice(0,10),q=JSON.parse(localStorage.getItem('cp_quota')||'{}');if(q.date!==d)q={date:d,used:0};return q}
async function runLive(c){let q=quota();if(q.used>=50)throw Error('Local public-demo quota guard reached 50 calls today.');let key=sessionStorage.getItem('cp_openrouter_key');let prompt=`You are a bounded claim-interpretation agent for generated Swiss tenant-law research claims. Use only the observable message and attachment names. Return JSON with keys category, subcategory, scope_state, unresolved_facts, next_action_hypothesis, evidence_quotes. Do not give legal advice or calculate deadlines. MESSAGE:\n${c.message}\nATTACHMENTS:\n${c.attachments.map(a=>a[0]).join('\n')||'none'}`;let res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.origin,'X-Title':'CasePath Swiss Claim Lab'},body:JSON.stringify({model:RELEASE.model,messages:[{role:'user',content:prompt}],temperature:0,response_format:{type:'json_object'},provider:{order:['NVIDIA'],allow_fallbacks:false}})});q.used++;localStorage.setItem('cp_quota',JSON.stringify(q));if(!res.ok)throw Error(`OpenRouter returned HTTP ${res.status}.`);let data=await res.json();let raw=data.choices?.[0]?.message?.content||'{}';let out=JSON.parse(raw);for(let k of ['category','scope_state','unresolved_facts'])if(!(k in out))throw Error('Live proposal failed the required-output contract.');out._receipt={model:RELEASE.model,provider:data.provider||'NVIDIA via OpenRouter',usage:data.usage||null,requestId:data.id||null};return out}
function openOpenRouter(){let q=quota();openModal('Connect a visitor-controlled OpenRouter key',`<div class="callout amber"><h3>Generated content only</h3><p>Do not paste real claim information or insurer secrets. The key stays in this browser session and is excluded from downloaded run bundles.</p></div><div class="field" style="margin-top:14px"><label for="orKey">OpenRouter API key</label><input id="orKey" type="password" autocomplete="off" placeholder="sk-or-v1-…"></div><div class="keyvals" style="margin-top:12px"><div class="keyval"><span>Model</span><strong>${RELEASE.model}</strong></div><div class="keyval"><span>Calls used today</span><strong>${q.used} / 50</strong></div><div class="keyval"><span>Storage</span><strong>session only</strong></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveKey()">Connect for this session</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function saveKey(){let v=$('#orKey')?.value.trim();if(!v)return toast('Enter an OpenRouter key.');sessionStorage.setItem('cp_openrouter_key',v);state.profile='live';closeModal();toast('OpenRouter key stored for this browser session only.')}
function compareProfiles(id){const c=claims.find(x=>x.id===id);openModal('Compare pipeline profiles',`<div class="compare"><div class="compare-panel"><div class="eyebrow">Process-grounded reference</div><h3>${esc(c.current)}</h3><div class="same"><strong>Targeted evidence</strong><br>${c.docs.filter(d=>d[1]==='missing').map(d=>esc(d[0])).join(', ')||'No current missing request'}</div><div class="same"><strong>Next action</strong><br>${esc(c.next)}</div><div class="keyvals"><div class="keyval"><span>Rounds</span><strong>${c.metrics.rounds}</strong></div><div class="keyval"><span>Repeated requests</span><strong>0</strong></div></div></div><div class="compare-panel"><div class="eyebrow">Static category checklist</div><h3>${esc(c.category)} template</h3><div class="diff"><strong>Broad request</strong><br>Lease, full correspondence, photographs, technical report, cost estimate, identity documents and all prior notices.</div><div class="diff"><strong>Next action</strong><br>Collect every category document before reviewing the process state.</div><div class="keyvals"><div class="keyval"><span>Rounds</span><strong>2.3</strong></div><div class="keyval"><span>Unnecessary requests</span><strong>4–9</strong></div></div></div></div><p class="fineprint" style="margin-top:12px">Comparison values are generated simulations, not measured enterprise impact.</p>`) }
function openModule(i){let m=modules[i];openModal(`${esc(m[0])} replacement contract`,`<div class="callout blue"><h3>Purpose</h3><p>${esc(m[1])} may be replaced without changing the canonical claim, process, checklist, review or evaluation schemas.</p></div><div class="grid two" style="margin-top:14px"><div class="keyval"><span>Input contract</span><strong>${esc(m[2])}</strong></div><div class="keyval"><span>Output contract</span><strong>${esc(m[3])}</strong></div><div class="keyval"><span>Validator</span><strong>${esc(m[4])}</strong></div><div class="keyval"><span>Transports</span><strong>Python · HTTP · MCP</strong></div><div class="keyval"><span>Timeout</span><strong>30 seconds</strong></div><div class="keyval"><span>Fallback</span><strong>typed failure / fail closed</strong></div></div><h3>Minimal conformance contract</h3><div class="code">{\n  "agent_id": "custom.${m[0].toLowerCase().replaceAll(' ','-')}",\n  "input_contract": "${m[2]}",\n  "output_contract": "${m[3]}",\n  "provenance_required": true,\n  "canonical_state_mutation": false,\n  "fallback": "fail_closed"\n}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="runConformance()">Run browser conformance check</button></div>`) }
function runConformance(){let checks=['Input schema declared','Output schema declared','Unknown facts preserved','Canonical state not mutated','Typed failure returned','Provenance present','Validator rejection accepted'];openModal('Agent conformance result',`<div class="callout green"><h3>7 / 7 interface checks passed</h3><p>This browser check validates the public contract shape. Full benchmark conformance still requires the research harness.</p></div><div class="fact-list" style="margin-top:14px">${checks.map(x=>`<div class="fact known"><div class="state">Passed</div><div><strong>${x}</strong></div></div>`).join('')}</div>`)}
function openGenerate(){openModal('Generate a local synthetic claim',`<div class="callout blue"><h3>Local sandbox</h3><p>The generated claim stays in this browser and does not enter the released benchmark or shared knowledge.</p></div><div class="field" style="margin-top:14px"><label for="genPrompt">Describe a fictional tenant-law situation</label><textarea id="genPrompt" placeholder="Example: recurring bathroom mould, landlord notified, no inspection yet"></textarea></div><div class="grid two" style="margin-top:10px"><div class="field"><label>Language</label><select id="genLang"><option>English</option><option>German</option></select></div><div class="field"><label>Canton</label><select id="genCanton"><option>Basel-Stadt</option><option>Zürich</option><option>Bern</option><option>Aargau</option></select></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="makeLocalClaim()">Create generated claim</button></div>`) }
function makeLocalClaim(){let p=$('#genPrompt')?.value.trim();if(!p)return toast('Describe a fictional situation first.');let id='LOCAL-'+Date.now().toString().slice(-6);let c=structuredClone(claims[0]);Object.assign(c,{id,subject:p.slice(0,72),summary:'Locally generated sandbox claim.',language:$('#genLang').value,canton:$('#genCanton').value,message:p,received:new Date().toLocaleString(),sender:'Generated customer',status:'Local sandbox'});claims.unshift(c);closeModal();selectClaim(id);toast('Local synthetic claim created. It is not part of the benchmark.')}
function downloadRun(id){let r=runs().filter(x=>x.claimId===id).at(-1);if(!r){let c=claims.find(x=>x.id===id);r={contract:'casepath.run-bundle/4.0',runId:'released-reference',claimId:id,release:RELEASE,accepted:{scope:c.scope,currentStep:c.current,documents:c.docs,nextAction:c.next},evidenceBoundary:'generated reference; no live model call'}}downloadJSON(`casepath-run-${id}.json`,r)}
function downloadAll(){downloadJSON('casepath-public-generated-claims.json',{release:RELEASE,claims})}
function downloadJSON(name,obj){let clean=JSON.parse(JSON.stringify(obj,(k,v)=>/key|token|secret/i.test(k)?undefined:v));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function openModal(title,body){let m=$('#modal');m.innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button></div><div class="modal-body">${body}</div></div>`;m.classList.add('open');m.setAttribute('aria-hidden','false');setTimeout(()=>m.querySelector('input,button,select,textarea')?.focus(),20)}
function closeModal(){let m=$('#modal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),3800)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
