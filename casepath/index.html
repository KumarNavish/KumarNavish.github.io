<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>CasePath — Opening the claim workspace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142033;background:#f7f8fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fa}
    main{width:min(560px,100%);padding:34px;background:#fff;border:1px solid #e1e6ee;border-radius:16px;box-shadow:0 24px 70px rgba(20,32,51,.08)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:18px}.mark{width:34px;height:34px;border-radius:9px;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:11px}
    h1{margin:30px 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.04;letter-spacing:-.045em}p{margin:0;color:#667085;line-height:1.55}
    .status{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding-top:22px;border-top:1px solid #e7eaf0}.dot{width:10px;height:10px;margin-top:6px;border-radius:999px;background:#c8102e;box-shadow:0 0 0 5px #fde9ed;flex:0 0 auto}
    .status strong{display:block;margin-bottom:4px}.detail{font-size:13px;color:#8a94a6}.error{margin-top:22px;padding:14px 16px;border-radius:10px;background:#fff4f5;color:#8b1024;white-space:pre-wrap;word-break:break-word}
    button{margin-top:18px;border:0;border-radius:9px;background:#c8102e;color:#fff;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body data-casepath-loader-release="12.0.4">
  <main>
    <div class="brand"><span class="mark">CP</span><span>CasePath</span></div>
    <h1>Opening the flagship claim</h1>
    <p>The complete workspace is being assembled from the verified release files.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><div><strong id="status">Loading the application…</strong><span class="detail" id="detail">Preparing release 12.0.4</span></div></div>
    <div id="error" class="error" hidden></div>
    <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script>
    (() => {
      'use strict';
      const RELEASE = '12.0.4';
      const PARTS = [0,1,2,3,4].map(index => `assets/bundle-v12-${String(index).padStart(3,'0')}.txt`);
      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const errorBox = document.getElementById('error');
      const retry = document.getElementById('retry');

      function setState(title, message) {
        status.textContent = title;
        detail.textContent = message;
      }

      function decodeBase64(encoded) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
        const clean = encoded.replace(/[^A-Za-z0-9+/]/g, '');
        if (!clean) throw new Error('The release payload is empty.');
        if (clean.length % 4 === 1) throw new Error('The release payload has an impossible base64 length.');
        const outputLength = Math.floor(clean.length * 3 / 4);
        const output = new Uint8Array(outputLength);
        let out = 0;
        for (let index = 0; index < clean.length; index += 4) {
          const a = alphabet.indexOf(clean[index]);
          const b = alphabet.indexOf(clean[index + 1]);
          const c = index + 2 < clean.length ? alphabet.indexOf(clean[index + 2]) : -1;
          const d = index + 3 < clean.length ? alphabet.indexOf(clean[index + 3]) : -1;
          if (a < 0 || b < 0 || (c < 0 && index + 2 < clean.length) || (d < 0 && index + 3 < clean.length)) {
            throw new Error(`The release payload contains invalid base64 data near character ${index}.`);
          }
          const value = (a << 18) | (b << 12) | ((c < 0 ? 0 : c) << 6) | (d < 0 ? 0 : d);
          output[out++] = (value >> 16) & 255;
          if (c >= 0) output[out++] = (value >> 8) & 255;
          if (d >= 0) output[out++] = value & 255;
        }
        return output.slice(0, out);
      }

      async function fetchPart(path, index) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch(`${path}?release=${RELEASE}`, { cache:'no-store', signal:controller.signal });
          if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
          const text = await response.text();
          if (!text.trim()) throw new Error(`${path} was empty`);
          setState('Loading the application…', `Release file ${index + 1} of ${PARTS.length} loaded`);
          return text;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function load() {
        retry.hidden = true;
        errorBox.hidden = true;
        try {
          if (!('DecompressionStream' in window)) {
            throw new Error('This browser cannot open the verified release package. Use a current Chrome, Edge, Firefox or Safari release.');
          }
          setState('Loading the application…', `Reading ${PARTS.length} verified release files`);
          const parts = [];
          for (let index = 0; index < PARTS.length; index += 1) parts.push(await fetchPart(PARTS[index], index));
          const encoded = parts.join('');
          setState('Verifying the workspace…', `${encoded.replace(/\s/g,'').length.toLocaleString()} encoded characters loaded`);
          const bytes = decodeBase64(encoded);
          if (bytes.length < 4 || bytes[0] !== 0x1f || bytes[1] !== 0x8b) {
            throw new Error('The verified release package did not contain a valid gzip stream.');
          }
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          const html = await new Response(stream).text();
          if (!/^\s*<!doctype html>/i.test(html) || !html.includes('CasePath') || !html.includes('flagship-v12-bootstrap')) {
            throw new Error('The decoded release did not contain the expected CasePath application.');
          }
          if (html.includes('casepath-payload') || html.includes("Failed to execute 'atob'")) {
            throw new Error('The decoded release unexpectedly contained another bootstrap payload.');
          }
          setState('Opening the claim…', 'The verified workspace is ready');
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          const message = error && error.name === 'AbortError'
            ? 'A release file took too long to load. Please retry.'
            : (error instanceof Error ? error.message : String(error));
          setState('CasePath could not open', 'The release stopped safely before the claim workspace loaded');
          errorBox.textContent = message;
          errorBox.hidden = false;
          retry.hidden = false;
        }
      }

      retry.addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
