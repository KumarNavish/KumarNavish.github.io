<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser cannot open the compressed application bundle.');
    const encoded=document.getElementById('casepath-payload').textContent.trim();
    const binary=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('CASEPATH_V12')) throw new Error('The application bundle failed its identity check.');
    document.open();document.write(html);document.close();
  }catch(error){
    boot.classList.add('error');
    boot.innerHTML='<div class="brand"><span class="mark">CP</span><span>CasePath</span></div><p><strong>CasePath could not open.</strong><br>'+String(error.message||error)+'</p><button type="button" onclick="location.reload()">Retry</button>';
  }
})();
</script>
</body>
</html>
