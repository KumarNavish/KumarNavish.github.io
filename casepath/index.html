<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>CasePath — Opening the claim workspace</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142033;background:#f7f8fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fa}
    main{width:min(560px,100%);padding:34px;background:#fff;border:1px solid #e1e6ee;border-radius:16px;box-shadow:0 24px 70px rgba(20,32,51,.08)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:780;font-size:18px}.mark{width:34px;height:34px;border-radius:9px;background:#c8102e;color:#fff;display:grid;place-items:center;font-size:11px}
    h1{margin:30px 0 10px;font-size:clamp(28px,5vw,42px);line-height:1.04;letter-spacing:-.045em}p{margin:0;color:#667085;line-height:1.55}
    .status{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding-top:22px;border-top:1px solid #e7eaf0}.dot{width:10px;height:10px;margin-top:6px;border-radius:999px;background:#c8102e;box-shadow:0 0 0 5px #fde9ed;flex:0 0 auto}
    .status strong{display:block;margin-bottom:4px}.detail{font-size:13px;color:#8a94a6}.error{margin-top:22px;padding:14px 16px;border-radius:10px;background:#fff4f5;color:#8b1024;white-space:pre-wrap;word-break:break-word}
    button{margin-top:18px;border:0;border-radius:9px;background:#c8102e;color:#fff;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">CP</span><span>CasePath</span></div>
    <h1>Opening the flagship claim</h1>
    <p>The complete workspace is being assembled from the verified release files.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><div><strong id="status">Loading the application…</strong><span class="detail" id="detail">Preparing release 12.0.3</span></div></div>
    <div id="error" class="error" hidden></div>
    <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script>
    (() => {
      'use strict';
      const PARTS = [0,1,2,3,4].map(index => `assets/bundle-v12-${String(index).padStart(3,'0')}.txt`);
      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const errorBox = document.getElementById('error');
      const retry = document.getElementById('retry');

      function setState(title, message) {
        status.textContent = title;
        detail.textContent = message;
      }

      async function load() {
        retry.hidden = true;
        errorBox.hidden = true;
        try {
          if (!('DecompressionStream' in window)) throw new Error('This browser does not support the secure release decompressor. Please use a current Chrome, Edge, Firefox or Safari release.');
          setState('Loading the application…', 'Reading 5 verified release segments');
          const responses = await Promise.all(PARTS.map(path => fetch(`${path}?release=12.0.3`, { cache:'no-store' })));
          for (let index = 0; index < responses.length; index += 1) {
            if (!responses[index].ok) throw new Error(`${PARTS[index]} returned HTTP ${responses[index].status}`);
          }
          const parts = await Promise.all(responses.map(response => response.text()));
          let encoded = parts.join('').replace(/[^A-Za-z0-9+/=]/g, '');
          if (!encoded) throw new Error('The release payload is empty.');
          const remainder = encoded.length % 4;
          if (remainder) encoded += '='.repeat(4 - remainder);
          setState('Verifying the workspace…', `${encoded.length.toLocaleString()} encoded characters loaded`);
          let binary;
          try { binary = atob(encoded); }
          catch (error) { throw new Error(`The release payload is not valid base64 (${error.message}).`); }
          const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          const html = await new Response(stream).text();
          if (!html.includes('<!doctype html>') || !html.includes('CasePath')) throw new Error('The decoded release did not contain the CasePath application.');
          setState('Opening the claim…', 'The verified workspace is ready');
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          setState('CasePath could not open', 'The public release failed before the claim workspace loaded');
          errorBox.textContent = error instanceof Error ? error.message : String(error);
          errorBox.hidden = false;
          retry.hidden = false;
        }
      }
      retry.addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
