name: motion-native-proof

on:
  push:
    branches: [motion-native-research-instrument-v2]
    paths: [motion-native-proof.ready]

permissions:
  contents: write

jobs:
  proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run complete repository gates
        run: make check

      - name: Verify removed production surfaces
        run: |
          test ! -e site/dist/safepatch
          ! grep -R -i --exclude='*.map' 'SafePatch' site/dist
          test ! -e site/dist/assets/folio.css
          test ! -e site/dist/assets/folio.js

      - name: Install Playwright Chromium
        working-directory: site
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production artifact
        run: |
          nohup python3 -m http.server 4173 --directory site/dist > /tmp/motion-proof-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/motion-proof-server.log
          exit 1

      - name: Run rendered scientific interaction proof
        env:
          NODE_PATH: ${{ github.workspace }}/site/node_modules
          MOTION_NATIVE_BASE_URL: http://127.0.0.1:4173
          MOTION_NATIVE_QA_DIR: ${{ github.workspace }}/site/qa-artifacts
        run: node .github/scripts/motion-native-proof.cjs

      - name: Preserve temporary review evidence
        run: |
          rm -rf review/motion-native-qa
          mkdir -p review/motion-native-qa
          cp site/qa-artifacts/*.png review/motion-native-qa/
          cp site/qa-artifacts/qa-result.json review/motion-native-qa/
          sha256sum review/motion-native-qa/* > review/motion-native-qa/SHA256SUMS.txt

      - name: Remove transient transfer and preview machinery
        run: |
          git rm -f motion-native-proof.ready .github/workflows/motion-native-proof.yml
          git rm -f .github/workflows/motion-native-preview.yml || true
          git rm -f motion-fixes.patch motion-polish.ready || true
          git rm -f .github/workflows/apply-motion-fixes.yml .github/workflows/apply-motion-polish.yml || true

      - name: Commit review proof
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate rendered motion-native portfolio"
          git push
