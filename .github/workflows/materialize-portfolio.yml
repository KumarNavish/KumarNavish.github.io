name: Materialize portfolio trajectory atlas

on:
  push:
    branches:
      - portfolio/trajectory-atlas
    paths:
      - ".github/workflows/materialize-portfolio.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: portfolio/trajectory-atlas
          fetch-depth: 0

      - name: Restore and verify portfolio files
        shell: python
        run: |
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          expected = {
              "site/index.html": "7a711cf96f0523fe4473856ab5ab1ff1bb35f19e8526340a204e2b45e78ba477",
              "site/src/portfolio.css": "b0d1a0a4e5031aebb3281e77e675c6c5e5bc82838a7fc5da69f2d0d480d87e1e",
              "site/src/portfolio.js": "d40139ca032a559b973b4fd09a5e5f8b36cd51ec294a1d912a0ad99a7b7a111a",
              "site/public/og-portfolio.png": "ace50601fdca132870b6f27d1042f4a5965fd229777c7cfa310108eb6c5b2f01",
              "site/public/favicon.svg": "d94fe7fda47dc053412a26f28bf72f97183af910acb580ae8d1d414fcce86126",
          }
          mapping = {
              ".portfolio-materialize/index.html": "site/index.html",
              ".portfolio-materialize/portfolio.css": "site/src/portfolio.css",
              ".portfolio-materialize/portfolio.js": "site/src/portfolio.js",
              ".portfolio-materialize/og-portfolio.png": "site/public/og-portfolio.png",
              ".portfolio-materialize/favicon.svg": "site/public/favicon.svg",
          }

          for source_dir, destination in mapping.items():
              parts = sorted(Path(source_dir).glob("part-*"))
              if not parts:
                  raise SystemExit(f"Missing payload parts for {source_dir}")
              encoded = "".join(path.read_text().strip() for path in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected[destination]:
                  raise SystemExit(
                      f"Digest mismatch for {destination}: {digest} != {expected[destination]}"
                  )
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          index = Path("site/index.html").read_text()
          required = [
              "I build learning systems that can change without losing what made them useful.",
              "https://openreview.net/forum?id=yCe0QP7OJQ",
              "https://openreview.net/forum?id=CwmHHYCbjK",
              "https://aclanthology.org/2025.acl-long.1551/",
              "Generative AI × spatial computing",
              "navish.kumar@unibas.ch",
          ]
          missing = [fragment for fragment in required if fragment not in index]
          if missing:
              raise SystemExit(f"Required portfolio content missing: {missing}")

          shutil.rmtree(".portfolio-materialize")
          shutil.rmtree(".portfolio-payload", ignore_errors=True)

      - name: Validate JavaScript syntax
        run: node --check site/src/portfolio.js

      - name: Commit materialized portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(portfolio): launch trajectory atlas"
          git push origin HEAD:portfolio/trajectory-atlas
