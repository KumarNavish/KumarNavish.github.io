name: portfolio browser acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/portfolio-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rendered-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install browser QA tools
        run: npm install --no-save --package-lock=false playwright@1.56.1 lighthouse@12.8.2

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Enforce bundle budgets
        run: node qa/assert-build-budget.mjs dist qa-artifacts/build-budget.json

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > qa-preview.log 2>&1 &
          echo $! > qa-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat qa-preview.log
          exit 1

      - name: Run rendered route and interaction acceptance
        env:
          PORTFOLIO_QA_BASE_URL: http://127.0.0.1:4173
          PORTFOLIO_QA_OUT: qa-artifacts
        run: node qa/portfolio.acceptance.mjs

      - name: Run Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:4173/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=qa-artifacts/lighthouse.json \
            --quiet
          node qa/assert-lighthouse.mjs qa-artifacts/lighthouse.json qa-artifacts/lighthouse-summary.json

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-acceptance-${{ github.sha }}
          path: |
            site/qa-artifacts/
            site/qa-preview.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if test -f qa-preview.pid; then
            kill "$(cat qa-preview.pid)" 2>/dev/null || true
          fi
