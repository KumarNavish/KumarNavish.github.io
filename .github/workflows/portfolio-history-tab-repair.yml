name: portfolio history tab repair

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/workflows/portfolio-history-tab-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Align rendered acceptance with ARIA tab semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Navish portfolio release bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/qa/portfolio.acceptance.mjs')
          source = path.read_text(encoding='utf-8')
          old = "await spatial.page.getByRole('button', { name: /^History$/i }).click()"
          new = "await spatial.page.getByRole('tab', { name: /^History$/i }).click()"
          if old not in source:
              raise SystemExit('Expected History-button selector was not found; refusing unsafe patch.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          cd site
          npm ci
          npm run typecheck
          npm run test
          npm run build
          cd ..

      - name: Commit verified repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/portfolio-history-tab-repair.yml
          git add site/qa/portfolio.acceptance.mjs
          git commit -m 'test(portfolio): activate spatial history tab semantically'
          git push origin HEAD:portfolio-atlas-2026
