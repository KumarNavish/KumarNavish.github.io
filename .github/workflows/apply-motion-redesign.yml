name: apply-motion-redesign

on:
  push:
    branches: [motion-native-research-instrument]
    paths: [motion-redesign.patch]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply redesign patch
        run: |
          git apply --index --binary motion-redesign.patch
          git rm --cached motion-redesign.patch
          rm motion-redesign.patch

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild portfolio as motion-native research instrument"
          git push
