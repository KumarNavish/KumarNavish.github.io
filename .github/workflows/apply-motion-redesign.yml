name: apply-motion-redesign

on:
  push:
    branches: [motion-native-research-instrument]
    paths: [motion-redesign.patch.ready]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply redesign patch
        run: |
          cat motion-redesign.patch.gz.b64.[0-9][0-9] | base64 -d | gzip -d > /tmp/motion-redesign.patch
          git apply --index --binary /tmp/motion-redesign.patch
          git rm motion-redesign.patch.gz.b64.[0-9][0-9] motion-redesign.patch.ready

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild portfolio as motion-native research instrument"
          git push
