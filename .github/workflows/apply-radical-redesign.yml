name: apply radical portfolio redesign

on:
  push:
    branches: [portfolio-radical-redesign-20260831]
    paths:
      - '.redesign/redesign.tar.xz'
      - '.github/workflows/apply-radical-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-radical-redesign-20260831
          fetch-depth: 0
      - name: Materialize the rebuilt experience
        shell: bash
        run: |
          set -euo pipefail
          xz -dc .redesign/redesign.tar.xz | tar -xf -
          rm -rf .redesign .github/workflows/apply-radical-redesign.yml
          git config user.name 'Navish portfolio redesign bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign the portfolio as a living research programme'
          git push origin HEAD:portfolio-radical-redesign-20260831
