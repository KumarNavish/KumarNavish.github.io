name: export-motion-source

on:
  push:
    branches: [motion-native-research-instrument]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive tracked source tree
        run: git archive --format=tar.gz --output=/tmp/motion-source.tgz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: motion-source
          path: /tmp/motion-source.tgz
          if-no-files-found: error
          retention-days: 1
