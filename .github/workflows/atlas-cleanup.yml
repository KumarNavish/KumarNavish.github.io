name: atlas cleanup

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - .github/workflows/atlas-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout atlas branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Remove temporary QA residue
        run: |
          rm -f ATLAS_QA.log
          rm -f .github/workflows/atlas-cleanup.yml

      - name: Commit clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(portfolio): remove temporary atlas QA residue"
            git push origin HEAD:portfolio-atlas-2026
          fi
