name: apply-portfolio-atlas

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/atlas-patch/**'
      - '.github/workflows/apply-portfolio-atlas.yml'

permissions:
  contents: write

concurrency:
  group: apply-portfolio-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Materialize authored portfolio
        shell: bash
        run: |
          set -euo pipefail
          cat .github/atlas-patch/part*.b64 | base64 --decode > /tmp/portfolio_patch.tar.gz
          echo 'a87e6be2c4ea776ef9f718c5cd17d289fc3be564870e072651ac23ef7a7c7c31  /tmp/portfolio_patch.tar.gz' | sha256sum --check
          tar -xzf /tmp/portfolio_patch.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Apply QA repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/src/chapters/ChapterScaffold.tsx')
          text = path.read_text()
          text = text.replace(
              "\n  useEffect(() => {\n    if (mode !== 'watch') setPlaying(false)\n  }, [mode])\n",
              "\n",
          )
          text = text.replace(
              "                    onClick={() => setMode(item)}\n",
              "                    onClick={() => {\n                      setMode(item)\n                      if (item !== 'watch') setPlaying(false)\n                    }}\n",
          )
          path.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install frontend dependencies
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Test
        working-directory: site
        run: npm run test

      - name: Production build
        working-directory: site
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/atlas-patch
          rm -f .github/workflows/apply-portfolio-atlas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(portfolio): ship motion-native research atlas'
          git push origin HEAD:portfolio-atlas-2026
