name: apply-gain-light-newfiles

on:
  push:
    branches: [gain-graph-light-flagship]
    paths: [gain-newfiles.ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate encoded source fragments
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          parts = sorted(Path('.').glob('gain-new3.part.[0-9][0-9]'))
          assert len(parts) == 12, [str(path) for path in parts]
          failed = False
          for path in parts:
              value = path.read_text()
              invalid = [(index, ord(char), repr(char), value[max(0, index - 24):index + 25]) for index, char in enumerate(value) if not re.fullmatch(r'[A-Za-z0-9+/=\s]', char)]
              print({'file': str(path), 'length': len(value), 'invalid_count': len(invalid)})
              for item in invalid[:20]:
                  print({'index': item[0], 'ord': item[1], 'char': item[2], 'context': repr(item[3])})
              failed = failed or bool(invalid)
          if failed:
              raise SystemExit('Malformed transfer fragment detected')

          combined = ''.join(path.read_text() for path in parts)
          combined = re.sub(r'\s+', '', combined)
          print({'base64_bytes': len(combined), 'mod4': len(combined) % 4, 'padding_positions': [i for i, char in enumerate(combined) if char == '=']})
          assert len(combined) % 4 == 0
          assert '=' not in combined[:-2]
          Path('/tmp/gain-newfiles.b64').write_text(combined)
          PY

      - name: Decode and add flagship source files
        run: |
          set -euo pipefail
          base64 --decode /tmp/gain-newfiles.b64 > /tmp/gain-newfiles.patch.gz
          gzip --test /tmp/gain-newfiles.patch.gz
          gzip --decompress --stdout /tmp/gain-newfiles.patch.gz > /tmp/gain-newfiles.patch
          git apply --check --binary /tmp/gain-newfiles.patch
          git apply --index --binary /tmp/gain-newfiles.patch

      - name: Remove transfer machinery and commit
        run: |
          git rm gain-new3.part.[0-9][0-9] gain-newfiles.ready .github/workflows/apply-gain-light-newfiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add the live gain-graph computation and interaction system"
          git push
