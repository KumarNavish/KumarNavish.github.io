name: apply-gain-light-newfiles

on:
  push:
    branches: [gain-graph-light-flagship]
    paths: [gain-newfiles.ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate encoded source fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(gain-new3.part.[0-9][0-9])
          test "${#parts[@]}" -eq 12
          for file in "${parts[@]}"; do
            printf '%s bytes=' "$file"
            wc -c < "$file"
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=[:space:]]' "$file"; then
              echo "Invalid base64 character in $file" >&2
              exit 1
            fi
          done
          cat "${parts[@]}" | tr -d '\r\n\t ' > /tmp/gain-newfiles.b64
          python3 - <<'PY'
          from pathlib import Path
          value = Path('/tmp/gain-newfiles.b64').read_text()
          print({'base64_bytes': len(value), 'mod4': len(value) % 4, 'padding_positions': [i for i, c in enumerate(value) if c == '=']})
          assert len(value) % 4 == 0
          if '=' in value:
              assert value.rstrip('=') + value[len(value.rstrip('=')):] == value
              assert value.find('=') >= len(value) - 2
          PY

      - name: Decode and add flagship source files
        run: |
          set -euo pipefail
          base64 --decode /tmp/gain-newfiles.b64 > /tmp/gain-newfiles.patch.gz
          gzip --test /tmp/gain-newfiles.patch.gz
          gzip --decompress --stdout /tmp/gain-newfiles.patch.gz > /tmp/gain-newfiles.patch
          git apply --check --binary /tmp/gain-newfiles.patch
          git apply --index --binary /tmp/gain-newfiles.patch

      - name: Remove transfer machinery and commit
        run: |
          git rm gain-new3.part.[0-9][0-9] gain-newfiles.ready .github/workflows/apply-gain-light-newfiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add the live gain-graph computation and interaction system"
          git push
