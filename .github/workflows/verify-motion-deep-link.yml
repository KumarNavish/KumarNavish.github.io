name: verify-motion-deep-link

on:
  push:
    branches:
      - motion-native-research-instrument-v2
    paths:
      - verify-motion-deep-link.ready

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build production application
        working-directory: site
        run: |
          npm install
          npm run build

      - name: Install Chromium
        working-directory: site
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        working-directory: site
        run: |
          mkdir -p deep-link-qa
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/deep-link-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/deep-link-preview.log
          exit 1

      - name: Verify direct route reaches Replay viewport
        id: qa
        continue-on-error: true
        run: node .github/scripts/verify-motion-deep-link.cjs

      - name: Record result
        if: always()
        run: |
          mkdir -p site/deep-link-qa
          printf '{"qa":"%s","commit":"%s"}\n' '${{ steps.qa.outcome }}' '${{ github.sha }}' > site/deep-link-qa/summary.json

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-deep-link-proof
          path: |
            site/deep-link-qa
            /tmp/deep-link-preview.log
          if-no-files-found: warn
          retention-days: 1
