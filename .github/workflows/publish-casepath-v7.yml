name: Publish CasePath v7 clarity release

on:
  push:
    branches: [casepath-v7-clarity]
    paths:
      - '.github/workflows/publish-casepath-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: casepath-v7-clarity
          fetch-depth: 0

      - name: Reconstruct the exact frontend
        shell: bash
        run: |
          set -euo pipefail
          cat .casepath-v7/index-chunk-* > /tmp/index.html.xz.b64
          test "$(wc -c < /tmp/index.html.xz.b64)" -eq 25832
          base64 --decode /tmp/index.html.xz.b64 > /tmp/index.html.xz
          echo '4a3c824fec62e19fe36b3db3baf18c870f8b77ef4113fb180f24097feca23db7  /tmp/index.html.xz' | sha256sum --check
          xz -dc /tmp/index.html.xz > casepath/index.html
          echo '231c7ecbde9d2f635d7aa59c51df04878504e3c75772860601e240584f3c1cd8  casepath/index.html' | sha256sum --check
          grep -F '<title>CasePath — Claim workspace</title>' casepath/index.html
          grep -F 'Where it is blocked' casepath/index.html
          grep -F 'Frontend 7.0.0' casepath/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess
          html=Path('casepath/index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
              pass
          P().feed(html)
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          assert len(scripts)==1
          Path('/tmp/casepath-v7.js').write_text(scripts[0],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/casepath-v7.js'],check=True)
          PY

      - name: Write release identity and documentation
        shell: bash
        run: |
          cat > casepath/health.json <<'EOF'
          {
            "status": "ok",
            "product": "CasePath Swiss Claim Lab",
            "release": "7.0.0",
            "experience": "process-first-new-claim-workspace",
            "generatedDataOnly": true,
            "realClaimsApproved": false,
            "customerContactApproved": false,
            "legalAdviceApproved": false,
            "deployedFrom": "master/casepath"
          }
          EOF
          cat > casepath/release.json <<'EOF'
          {
            "release": "7.0.0",
            "productModel": "CasePath turns a new claim submission into a clear handling process, targeted evidence needs, prepared documents, and the next safe action.",
            "navigation": ["Claims", "Knowledge", "System"],
            "primaryJourney": "new claim -> analysis -> process -> evidence -> documents -> precedents -> expert review",
            "sourceSha256": "231c7ecbde9d2f635d7aa59c51df04878504e3c75772860601e240584f3c1cd8"
          }
          EOF
          cat > casepath/data/manifest.json <<'EOF'
          {
            "contract": "casepath.public-product-manifest/2.0.0",
            "releaseVersion": "7.0.0",
            "releaseDate": "2026-08-07",
            "benchmarkVersion": "1.2.0-generated",
            "schemaVersion": "2.0.0",
            "publicClaims": 8,
            "publicUrl": "https://casepath-swiss-claim-lab.onrender.com/",
            "hosting": {"provider":"Render","serviceId":"srv-d9q3ndvavr4c73ao86r0","branch":"master","publishPath":"casepath"},
            "safety": {"generatedDataOnly":true,"realClaimsApproved":false,"customerContactApproved":false,"legalAdviceApproved":false,"autonomousUpdateApproved":false}
          }
          EOF
          cat > casepath/README.md <<'EOF'
          # CasePath Swiss Claim Lab — v7

          Public URL: **https://casepath-swiss-claim-lab.onrender.com/**

          CasePath turns a new, imperfect claim submission into a clear handling process, the evidence still needed, prepared documents, similar precedents, and the next safe action.

          ## Product structure

          - **Claims** — new-claim intake, calm inbox, and the complete claim workspace
          - **Knowledge** — process questions, evidence needs, reviewed cases, and proposed improvements
          - **System** — replaceable module contracts and release details

          ## Safety boundary

          This is a generated-data research demonstration. It is not approved for real claim processing, customer communication, legal advice, coverage decisions, or autonomous shared-knowledge changes.
          EOF

      - name: Commit the verified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .casepath-v7
          rm -f .github/workflows/publish-casepath-v7.yml
          git config user.name 'CasePath release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CasePath v7 process-first experience [skip ci]'
          git push origin HEAD:casepath-v7-clarity
