name: Clean immersive atlas bootstrap files

on:
  push:
    branches:
      - portfolio-immersive-atlas-2026
    paths:
      - .github/workflows/cleanup-immersive-atlas-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalized branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verify finalized implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="atlas-film-canvas"' site/index.html
          grep -q '/portfolio/atlas-film.js' site/index.html
          test -s site/public/portfolio/atlas-film.js
          node --check site/public/portfolio/atlas-film.js
          node --check site/public/portfolio/atlas.js

      - name: Remove temporary payload files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch portfolio-atlas-payload.tar.zst.b64
          git rm -rf --ignore-unmatch .atlas-payload .atlas-payload-v3
          if ! git diff --cached --quiet; then
            git commit -m "chore(portfolio): remove materialization payloads"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/materialize-immersive-atlas.yml \
            .github/workflows/finalize-immersive-atlas.yml \
            .github/workflows/cleanup-immersive-atlas-bootstrap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(portfolio): remove bootstrap workflows"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Workflow cleanup was not permitted; preserving the finalized implementation."
            git reset --hard HEAD^
          fi
