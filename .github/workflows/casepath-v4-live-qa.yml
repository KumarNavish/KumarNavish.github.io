name: CasePath v4 live product verification

on:
  push:
    branches: [casepath-product-v4-20260806]
    paths:
      - '.github/workflows/casepath-v4-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: casepath-product-v4-20260806
          fetch-depth: 0

      - name: Select the deployed Render site
        id: site
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://casepath-claim-workspace.onrender.com'
            'https://casepath-claim-workspace-v4.onrender.com'
            'https://casepath-claim-workspace-v4-final.onrender.com'
          )
          selected=''
          for cycle in $(seq 1 45); do
            for url in "${urls[@]}"; do
              code=$(curl -L --silent --show-error --max-time 30 -o /tmp/health.json -w '%{http_code}' "$url/health.json" || true)
              if [ "$code" = '200' ] && grep -q '"release": "4.0.0"' /tmp/health.json; then
                selected="$url"
                break 2
              fi
            done
            sleep 10
          done
          test -n "$selected"
          echo "url=$selected" >> "$GITHUB_OUTPUT"
          mkdir -p casepath-final/reports/live
          printf '%s\n' "$selected" > casepath-final/reports/live/public-url.txt
          curl -L --fail --silent --show-error "$selected/health.json" > casepath-final/reports/live/health.json

      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Exercise the complete public journey
        env:
          PUBLIC_URL: ${{ steps.site.outputs.url }}
        shell: bash
        run: |
          cat > /tmp/live-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.PUBLIC_URL;
          const browser=await chromium.launch({headless:true});
          const errors=[]; const checks=[];
          const pass=(name,ok,detail='')=>{checks.push({name,passed:Boolean(ok),detail});if(!ok)throw new Error(name+': '+detail)};
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          page.on('pageerror',e=>errors.push('page: '+e.message));
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          pass('product title',await page.title()==='CasePath Swiss Claim Lab',await page.title());
          pass('claims inbox',await page.getByText('Generated Swiss tenant-law claims').isVisible());
          pass('eight public claims',await page.locator('tbody tr').count()===8,String(await page.locator('tbody tr').count()));
          await page.screenshot({path:'casepath-final/reports/live/01-inbox-desktop.png',fullPage:true});
          await page.getByRole('button',{name:'Run the mould-claim demo'}).click();
          await page.getByText('Analysis complete',{exact:false}).waitFor({state:'visible',timeout:30000}).catch(()=>{});
          await page.waitForTimeout(500);
          pass('claim workspace',await page.getByText('Mould keeps returning in the bedroom',{exact:true}).isVisible());
          pass('current blocker visible',await page.getByText('Is the mould caused by a building defect or tenant behaviour?',{exact:true}).first().isVisible());
          pass('next action visible',await page.getByText('Obtain an independent technical assessment before selecting the remedy path.',{exact:true}).first().isVisible());
          await page.screenshot({path:'casepath-final/reports/live/02-claim-workspace.png',fullPage:true});
          await page.getByRole('tab',{name:'Process'}).click();
          pass('process graph',await page.getByText('Claim-specific handling process').isVisible());
          await page.getByRole('button',{name:/Cause assessment, current/}).click();
          pass('process detail',await page.getByText('It controls what may happen next').isVisible());
          await page.screenshot({path:'casepath-final/reports/live/03-process.png',fullPage:true});
          await page.getByRole('tab',{name:'Documents'}).click();
          pass('process-derived checklist',await page.getByText('Every document has a reason and an owning step').isVisible());
          pass('technical report missing',await page.getByText('Technical inspection report',{exact:true}).isVisible());
          await page.getByText('Technical inspection report',{exact:true}).click();
          pass('document opens owning node',await page.getByText('It controls what may happen next').isVisible());
          await page.getByRole('tab',{name:'Audit trail'}).click();
          pass('unified audit trail',await page.getByText('One audit trail for the whole claim').isVisible());
          await page.getByRole('button',{name:'Inspect'}).first().click();
          pass('audit technical detail',await page.getByText('Accepted structured output').isVisible());
          await page.screenshot({path:'casepath-final/reports/live/04-audit.png',fullPage:true});
          await page.getByRole('tab',{name:'Expert review'}).click();
          await page.getByRole('button',{name:/Approve with edits/}).click();
          await page.locator('#justification').fill('Generated QA correction: require the cause-assessment rationale to cite the reached process question.');
          await page.getByRole('button',{name:'Save structured review'}).click();
          pass('knowledge quarantine',await page.getByText('A correction becomes inspectable knowledge—not an instant rule').isVisible());
          pass('support threshold',await page.getByText('1 / 3 claims',{exact:true}).isVisible());
          await page.screenshot({path:'casepath-final/reports/live/05-knowledge-impact.png',fullPage:true});
          await page.getByRole('button',{name:'Knowledge'}).first().click();
          await page.locator('#knowledgeSearch').fill('Which mould claims need a technical inspection?');
          pass('knowledge question search',await page.getByText('Technical inspection report',{exact:true}).isVisible());
          await page.getByRole('button',{name:'System'}).first().click();
          pass('nine swap points',await page.getByText('9 swap points',{exact:true}).isVisible());
          await page.getByRole('button',{name:'Replace this module'}).nth(4).click();
          pass('module replacement contract',await page.getByText('Process agent replacement contract',{exact:true}).isVisible());
          await page.getByRole('button',{name:'Run browser conformance check'}).click();
          pass('conformance result',await page.getByText('7 / 7 interface checks passed').isVisible());
          await page.screenshot({path:'casepath-final/reports/live/06-system.png',fullPage:true});
          await page.setViewportSize({width:390,height:844});
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          const overflow=await page.evaluate(()=>Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth));
          pass('mobile overflow',overflow===0,String(overflow));
          await page.getByRole('button',{name:'Run the mould-claim demo'}).click();
          await page.waitForTimeout(2600);
          pass('mobile claim workspace',await page.getByText('Mould keeps returning in the bedroom',{exact:true}).isVisible());
          await page.screenshot({path:'casepath-final/reports/live/07-mobile.png',fullPage:true});
          pass('browser errors',errors.length===0,errors.join('\n'));
          const report={contract:'casepath.live-browser-qa/4.0',url,verifiedAt:new Date().toISOString(),checks,passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,browserErrors:errors,mobileOverflowPx:overflow};
          fs.writeFileSync('casepath-final/reports/live/browser-qa.json',JSON.stringify(report,null,2)+'\n');
          await browser.close();
          JS
          node /tmp/live-qa.mjs

      - name: Audit public assets
        env:
          PUBLIC_URL: ${{ steps.site.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['PUBLIC_URL'].rstrip('/')
          paths=['/','/health.json']
          rows=[]
          for path in paths:
              with urllib.request.urlopen(base+path,timeout=60) as response:
                  body=response.read()
                  rows.append({'path':path,'status':response.status,'bytes':len(body),'content_type':response.headers.get('content-type')})
          assert all(r['status']==200 and r['bytes']>50 for r in rows)
          open('casepath-final/reports/live/asset-audit.json','w').write(json.dumps({'baseUrl':base,'assets':rows,'passed':True},indent=2)+'\n')
          PY

      - name: Persist sanitized live evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CasePath live verification'
          git config user.email 'actions@users.noreply.github.com'
          git add casepath-final/reports/live
          git commit -m 'Record CasePath v4 live browser evidence [skip ci]'
          git push origin HEAD:casepath-product-v4-20260806
