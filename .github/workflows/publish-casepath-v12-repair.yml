name: Repair and publish CasePath v12.0.1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-casepath-v12-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casepath-v12-source-repair
  cancel-in-progress: false

jobs:
  reconstruct-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Reconstruct the checksum-bound v12 source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/casepath-v12-transport /tmp/casepath-v12-source
          mkdir -p /tmp/casepath-v12-transport /tmp/casepath-v12-source
          for part in 00 01 02 03 04 05 06; do
            curl --fail --location --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/KumarNavish/KumarNavish.github.io/casepath-flagship-v12/casepath-v12-upload/chunk-${part}" \
              --output "/tmp/casepath-v12-transport/chunk-${part}"
          done
          cat > /tmp/casepath-v12-transport/checksums <<'EOF'
          03c329fa226cd5276f7c0491ddf0b090b216d38caf60b765e221ba39c7f4a947  /tmp/casepath-v12-transport/chunk-00
          760fe5ccceca0e78f9a68c149d7bf1e5e799196dcf11b81f951dbbd5b749e288  /tmp/casepath-v12-transport/chunk-01
          10da6f46705d5b6833bf46d4de5b3c78f2a39018dd6aa6adf1882f1d4ddc9bb2  /tmp/casepath-v12-transport/chunk-02
          2d61e04e864a06b1704e423580e81f5c9d1a5ee67847b598e75d1125c6c1248d  /tmp/casepath-v12-transport/chunk-03
          b5f7031db11d207f413aeb7165766a9e668b50e67dfad9bde1be477bff7535b3  /tmp/casepath-v12-transport/chunk-04
          f40cb8904c62325141fc50159ab1de363086852610dc47b5770d3508f589640c  /tmp/casepath-v12-transport/chunk-05
          bdf5021da77302a3b52c704f29aec02f8bab89e7b84920f4d31f52f4f30ffb0  /tmp/casepath-v12-transport/chunk-06
          EOF
          sha256sum --check /tmp/casepath-v12-transport/checksums
          cat /tmp/casepath-v12-transport/chunk-* > /tmp/casepath-v12-transport/archive.b64
          test "$(wc -c < /tmp/casepath-v12-transport/archive.b64)" -eq 371400
          echo 'bc1cbb5ad383197da737c639981abda4c80bdb1924614514144670c3a1193a15  /tmp/casepath-v12-transport/archive.b64' | sha256sum --check
          base64 --decode /tmp/casepath-v12-transport/archive.b64 > /tmp/casepath-v12-transport/archive.tar.xz
          echo 'b1f1253589588557b9aeb6d81302220d833154d5d0f0ad44668acc46e11f4b4d  /tmp/casepath-v12-transport/archive.tar.xz' | sha256sum --check
          xz --test /tmp/casepath-v12-transport/archive.tar.xz
          tar -xJf /tmp/casepath-v12-transport/archive.tar.xz -C /tmp/casepath-v12-source
          test -f /tmp/casepath-v12-source/casepath/index.html
          test -f /tmp/casepath-v12-source/casepath/release.json
          test -f /tmp/casepath-v12-source/casepath-api/generate_flagship_v12.py
          test -f /tmp/casepath-v12-source/casepath-api/casepath_api/data_v12.py
          test -f /tmp/casepath-v12-source/casepath-api/casepath_api/pipeline_v12.py
          grep -q '"release": "12.0.1"' /tmp/casepath-v12-source/casepath/release.json

      - name: Replace illustrated evidence with licensed source photographs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('/tmp/casepath-v12-source')
          generator = root / 'casepath-api/generate_flagship_v12.py'
          text = generator.read_text(encoding='utf-8')
          if 'import urllib.request' not in text:
              text = text.replace('from io import BytesIO\n', 'from io import BytesIO\nimport urllib.request\n')
          text = text.replace(
              'from PIL import Image, ImageDraw, ImageFilter\n',
              'from PIL import Image, ImageDraw, ImageFilter, ImageOps\n',
          )
          start = text.index('def make_primary_photos():')
          end = text.index('def build():')
          replacement = r'''PHOTO_SOURCES = {
              'bedroom-mould-2026-07-27.jpg': {
                  'urls': [
                      'https://upload.wikimedia.org/wikipedia/commons/2/28/Wohnraum_mit_Schimmelpilzbefall_an_der_Wand.jpg',
                      'https://upload.wikimedia.org/wikipedia/commons/6/69/Indoor_Mold.jpg',
                  ],
                  'target': (1600, 1100),
                  'credit': 'Bärbel Winkler, Wikimedia Commons, CC BY-SA 4.0',
              },
              'bedroom-mould-close-2026-07-27.jpg': {
                  'urls': [
                      'https://upload.wikimedia.org/wikipedia/commons/a/aa/Black_Mold_on_a_Wall_in_Brooklyn_08.jpg',
                      'https://upload.wikimedia.org/wikipedia/commons/d/db/Black_Mold_on_a_Wall_in_Brooklyn_07.jpg',
                  ],
                  'target': (1500, 1000),
                  'credit': 'C-Monster, Wikimedia Commons, CC BY 2.0',
              },
              'bedroom-context-2026-07-27.jpg': {
                  'urls': [
                      'https://upload.wikimedia.org/wikipedia/commons/b/b4/Damp_and_mold_damage_on_outside_and_inside_of_a_wall.jpg',
                      'https://upload.wikimedia.org/wikipedia/commons/6/69/Indoor_Mold.jpg',
                  ],
                  'target': (1500, 1000),
                  'credit': 'Putput, Wikimedia Commons, CC BY-SA 4.0',
              },
              'later-window-condensation-2026-08-12.jpg': {
                  'urls': [
                      'https://upload.wikimedia.org/wikipedia/commons/e/ef/Moldy_Window_%2832026056581%29.jpg',
                      'https://upload.wikimedia.org/wikipedia/commons/6/69/Indoor_Mold.jpg',
                  ],
                  'target': (1500, 1000),
                  'credit': 'Matt Brown, Wikimedia Commons, CC BY-SA 2.0',
              },
          }


          def _download_source_photo(urls):
              failures = []
              for url in urls:
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={'User-Agent': 'CasePath/12.0.1 photographic-evidence-builder'},
                      )
                      with urllib.request.urlopen(request, timeout=45) as response:
                          payload = response.read()
                      image = ImageOps.exif_transpose(Image.open(BytesIO(payload))).convert('RGB')
                      if image.width < 800 or image.height < 500:
                          raise ValueError(f'photograph is too small: {image.size}')
                      return image, url
                  except Exception as exc:
                      failures.append(f'{url}: {exc}')
              raise RuntimeError('No licensed photographic source could be downloaded. ' + ' | '.join(failures))


          def _cover_crop(image, target):
              target_width, target_height = target
              target_ratio = target_width / target_height
              source_ratio = image.width / image.height
              if source_ratio > target_ratio:
                  crop_width = int(image.height * target_ratio)
                  left = max(0, (image.width - crop_width) // 2)
                  image = image.crop((left, 0, left + crop_width, image.height))
              else:
                  crop_height = int(image.width / target_ratio)
                  top = max(0, (image.height - crop_height) // 2)
                  image = image.crop((0, top, image.width, top + crop_height))
              return image.resize(target, Image.Resampling.LANCZOS)


          def _write_real_photo(filename):
              spec = PHOTO_SOURCES[filename]
              image, used_url = _download_source_photo(spec['urls'])
              image = _cover_crop(image, spec['target'])
              image.save(OUT / filename, quality=93, subsampling=0, optimize=True)
              return used_url


          def _write_photo_attribution(used_sources):
              lines = [
                  '# Evidence image attribution',
                  '',
                  'CasePath v12.0.1 uses licensed source photographs for fictional claim packages. '
                  'The photographs are not presented as images of a real insured person or a real claim.',
                  '',
              ]
              for filename, used_url in used_sources.items():
                  lines.extend([
                      f'## {filename}',
                      f'- Source: {used_url}',
                      f"- Credit and licence: {PHOTO_SOURCES[filename]['credit']}",
                      '- Processing: orientation correction, centre crop, resizing and JPEG optimisation only; no illustrated reconstruction.',
                      '',
                  ])
              content = '\n'.join(lines)
              (OUT / 'IMAGE_ATTRIBUTION.md').write_text(content, encoding='utf-8')
              (ROOT / 'IMAGE_ATTRIBUTION.md').write_text(content, encoding='utf-8')


          def make_primary_photos():
              used = {}
              for filename in (
                  'bedroom-mould-2026-07-27.jpg',
                  'bedroom-mould-close-2026-07-27.jpg',
                  'bedroom-context-2026-07-27.jpg',
              ):
                  used[filename] = _write_real_photo(filename)
              make_contact_sheet(
                  OUT / 'mould-photo-sheet.pdf',
                  'Photograph Index — Bedroom Moisture Condition',
                  [
                      ('bedroom-mould-2026-07-27.jpg', 'Wide room view'),
                      ('bedroom-mould-close-2026-07-27.jpg', 'Close view of visible surface mould'),
                      ('bedroom-context-2026-07-27.jpg', 'Wall and room context'),
                  ],
                  '27 July 2026',
              )
              _write_photo_attribution(used)


          def create_later_window_photo():
              used_url = _write_real_photo('later-window-condensation-2026-08-12.jpg')
              attribution = OUT / 'IMAGE_ATTRIBUTION.md'
              existing = attribution.read_text(encoding='utf-8') if attribution.exists() else '# Evidence image attribution\n\n'
              appendix = '\n'.join([
                  '## later-window-condensation-2026-08-12.jpg',
                  f'- Source: {used_url}',
                  f"- Credit and licence: {PHOTO_SOURCES['later-window-condensation-2026-08-12.jpg']['credit']}",
                  '- Processing: orientation correction, centre crop, resizing and JPEG optimisation only; no illustrated reconstruction.',
                  '',
              ])
              if '## later-window-condensation-2026-08-12.jpg' not in existing:
                  existing += '\n' + appendix
              attribution.write_text(existing, encoding='utf-8')
              (ROOT / 'IMAGE_ATTRIBUTION.md').write_text(existing, encoding='utf-8')


          '''
          text = text[:start] + replacement + text[end:]
          generator.write_text(text, encoding='utf-8')

          data = root / 'casepath-api/casepath_api/data_v12.py'
          data_text = data.read_text(encoding='utf-8')
          data_text = data_text.replace('Generated source photograph', 'Customer-supplied photograph')
          data_text = data_text.replace('Generated photograph', 'Customer-supplied photograph')
          data.write_text(data_text, encoding='utf-8')
          PY

      - name: Install the repaired source atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf casepath casepath-api
          cp -a /tmp/casepath-v12-source/casepath ./casepath
          cp -a /tmp/casepath-v12-source/casepath-api ./casepath-api
          cat > casepath-api/requirements.txt <<'EOF'
          fastapi==0.116.1
          starlette==0.47.3
          uvicorn[standard]==0.35.0
          pydantic==2.11.7
          pypdf==5.9.0
          SQLAlchemy==2.0.43
          python-multipart==0.0.20
          reportlab==4.4.3
          Pillow==11.3.0
          PyMuPDF==1.26.4
          EOF
          rm -rf casepath-v12-runtime-payload casepath-v12-upload casepath-v12-small
          rm -f casepath-v12-runtime-manifest.json casepath-v12-deployment-probe.txt casepath-v12-content-probe.txt casepath-v12-1201-branch-probe.txt

      - name: Build and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r casepath-api/requirements.txt pytest httpx
          python casepath-api/generate_flagship_v12.py
          test "$(cat casepath-api/artifacts/.flagship-v12)" = '12.0.1'
          grep -q 'Moldy_Window' casepath-api/IMAGE_ATTRIBUTION.md
          grep -q 'Wohnraum_mit_Schimmelpilzbefall' casepath-api/IMAGE_ATTRIBUTION.md
          python -m compileall -q casepath-api/casepath_api casepath-api/generate_flagship_v12.py
          node --check casepath/assets/flagship-v12-bootstrap.js
          node --check casepath/assets/flagship-v12-core.js
          node --check casepath/assets/flagship-v12.js
          node --check casepath/tools/v12-live-qa.mjs

          export PYTHONPATH=casepath-api
          export CASEPATH_DB_PATH=/tmp/casepath-v12-publish.db
          tests=(
            test_release_and_flagship_package
            test_source_documents_have_no_answer_clues
            test_flagship_process_law_evidence_chain
            test_expert_correction_recomputes_evidence_and_creates_memory
            test_same_category_facts_change_process_and_checklist
            test_three_flagships_have_different_current_questions
          )
          for test_name in "${tests[@]}"; do
            rm -f "$CASEPATH_DB_PATH" "$CASEPATH_DB_PATH-shm" "$CASEPATH_DB_PATH-wal"
            pytest -q "casepath-api/tests/test_flagship_v12.py::${test_name}"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import hashlib

          root = Path('casepath-api/artifacts')
          names = [
              'bedroom-mould-2026-07-27.jpg',
              'bedroom-mould-close-2026-07-27.jpg',
              'bedroom-context-2026-07-27.jpg',
              'later-window-condensation-2026-08-12.jpg',
          ]
          hashes = set()
          for name in names:
              path = root / name
              image = Image.open(path).convert('RGB')
              assert image.width >= 800 and image.height >= 500, (name, image.size)
              assert sum(ImageStat.Stat(image).stddev) > 25, (name, 'insufficient photographic variation')
              hashes.add(hashlib.sha256(path.read_bytes()).hexdigest())
          assert len(hashes) == len(names), 'Evidence photographs must be distinct files'
          assert (root / 'IMAGE_ATTRIBUTION.md').exists()
          PY

      - name: Commit the reconstructed product to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-casepath-v12.yml
          rm -f .github/workflows/publish-casepath-v12-repair.yml
          git config user.name 'CasePath v12 release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CasePath v12.0.1 source and licensed photographic evidence [skip ci]'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
