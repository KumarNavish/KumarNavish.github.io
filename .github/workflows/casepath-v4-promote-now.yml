name: Promote CasePath v4 after live verification

on:
  push:
    branches: [casepath-product-v4-20260806]
    paths:
      - '.github/workflows/casepath-v4-promote-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: casepath-product-v4-20260806
          fetch-depth: 0
      - name: Wait briefly for live evidence
        run: |
          for i in $(seq 1 30); do
            git fetch origin casepath-product-v4-20260806
            git reset --hard origin/casepath-product-v4-20260806
            test -f casepath-final/reports/live/browser-qa.json && test -f casepath-final/reports/live/asset-audit.json && exit 0
            sleep 10
          done
          exit 1
      - name: Enforce release gates
        run: |
          python - <<'PY'
          import json
          qa=json.load(open('casepath-final/reports/live/browser-qa.json'))
          assets=json.load(open('casepath-final/reports/live/asset-audit.json'))
          assert qa['failed']==0, qa
          assert qa['browserErrors']==[], qa
          assert qa['mobileOverflowPx']==0, qa
          assert qa['passed']>=18, qa
          assert assets['passed'] is True, assets
          assert all(a['status']==200 for a in assets['assets']), assets
          PY
      - name: Open and merge verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head casepath-product-v4-20260806 --base master --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base master --head casepath-product-v4-20260806 \
              --title 'Release verified CasePath claim workspace v4' \
              --body 'Publishes the independently verified CasePath v4 claim-handling product with live browser QA, asset checks, mobile overflow checks, expert-review tests and governed knowledge-path evidence.'
            existing=$(gh pr list --head casepath-product-v4-20260806 --base master --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$existing" --merge --delete-branch=false
