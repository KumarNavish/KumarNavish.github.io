name: portfolio research status audit

on:
  workflow_dispatch:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/workflows/portfolio-research-status-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query public OpenReview records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          forums = {
              "experience_replay": "4z7il66fFb",
              "rank_feasibility": "CwmHHYCbjK",
          }

          def get_json(url: str):
              req = urllib.request.Request(url, headers={"User-Agent": "Navish-portfolio-status-audit/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          output = {
              "audited_at": datetime.now(timezone.utc).isoformat(),
              "source": "public OpenReview API v2",
              "forums": {},
          }
          for key, forum_id in forums.items():
              note_url = "https://api2.openreview.net/notes?" + urllib.parse.urlencode({"id": forum_id, "details": "all"})
              replies_url = "https://api2.openreview.net/notes?" + urllib.parse.urlencode({"forum": forum_id, "details": "all", "limit": 1000})
              output["forums"][key] = {
                  "forum_id": forum_id,
                  "submission": get_json(note_url),
                  "replies": get_json(replies_url),
              }

          with open("audit/openreview-status.json", "w", encoding="utf-8") as handle:
              json.dump(output, handle, indent=2, ensure_ascii=False)
          PY

      - name: Summarize decision and venue fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('audit/openreview-status.json').read_text())
          summary = {"audited_at": raw["audited_at"], "forums": {}}
          for key, payload in raw["forums"].items():
              notes = payload["submission"].get("notes", [])
              submission = notes[0] if notes else {}
              content = submission.get("content", {})
              def value(field):
                  item = content.get(field)
                  return item.get("value") if isinstance(item, dict) else item
              replies = payload["replies"].get("notes", [])
              decision_replies = []
              for reply in replies:
                  invitation_blob = " ".join(reply.get("invitations", []))
                  reply_content = reply.get("content", {})
                  title = reply_content.get("title", {})
                  title_value = title.get("value") if isinstance(title, dict) else title
                  if "Decision" in invitation_blob or (isinstance(title_value, str) and "Decision" in title_value):
                      decision_replies.append({
                          "id": reply.get("id"),
                          "invitations": reply.get("invitations", []),
                          "content": reply_content,
                          "mdate": reply.get("mdate"),
                      })
              summary["forums"][key] = {
                  "forum_id": payload["forum_id"],
                  "title": value("title"),
                  "venue": value("venue"),
                  "venueid": value("venueid"),
                  "authors": value("authors"),
                  "submission_mdate": submission.get("mdate"),
                  "decision_replies": decision_replies,
                  "reply_count": len(replies),
              }
          Path('audit/openreview-status-summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False))
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-research-status-audit
          path: audit/
          retention-days: 14
