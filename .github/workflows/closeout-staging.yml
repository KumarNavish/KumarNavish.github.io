name: Verify initial reading-position handoff
on:
  push:
    branches: [site/closeout-20260914]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact candidate without weakening acceptance
        run: python .delivery/closeout_patch.py
      - name: Preserve numerical and state invariants
        run: |
          mkdir -p /tmp/closeout-review
          npm test > /tmp/closeout-review/unit-tests.txt
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Serve the candidate on an ordinary HTTP origin
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/closeout-http.log 2>&1 &
      - name: Original visitor acceptance
        run: python scripts/completion_acceptance.py --engine ${{ matrix.engine }} --url http://127.0.0.1:8765 --out /tmp/closeout-review/visitor
      - name: Reflow and user-input race regressions
        run: python scripts/scroll_race_checks.py --engine ${{ matrix.engine }} --url http://127.0.0.1:8765 --out /tmp/closeout-review/race
      - name: Explorer rendering under delayed reflow
        run: python scripts/handoff_checks.py --engine ${{ matrix.engine }} --url http://127.0.0.1:8765 --out /tmp/closeout-review/handoff
      - name: Preserve exact source and any adverse evidence
        if: always()
        run: |
          mkdir -p /tmp/closeout-review
          python -c "from pathlib import Path; import zipfile; root=Path('.'); z=zipfile.ZipFile('/tmp/closeout-review/source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,str(p)) for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ['.git','.delivery','__pycache__','node_modules'])]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closeout-candidate-${{ matrix.engine }}-${{ github.run_id }}
          path: /tmp/closeout-review
          retention-days: 7
