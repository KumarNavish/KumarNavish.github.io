name: Distinguish viewport reflow from same-document navigation
on:
  push:
    branches: [site/closeout-20260914]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python .delivery/refine_mode.py
          python .delivery/compact_mode.py
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/inspection-http.log 2>&1 &
      - name: Observe viewport-only and URL-navigation paths independently
        run: |
          python .delivery/resize_probe.py --engine chromium --url http://127.0.0.1:8765 --out /tmp/resize-observed/chromium
          python .delivery/resize_probe.py --engine webkit --url http://127.0.0.1:8765 --out /tmp/resize-observed/webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resize-navigation-observations-${{ github.run_id }}
          path: /tmp/resize-observed
          retention-days: 7
