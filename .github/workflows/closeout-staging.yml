name: Seal the browser-verified reading handoff
on:
  push:
    branches: [site/closeout-20260914]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate exact browser-verified bytes
        run: |
          python .delivery/closeout_patch.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          data={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if not p.startswith('.delivery/') and p!='.github/workflows/closeout-staging.yml'}
          payload=json.dumps(data,sort_keys=True,separators=(',',':')).encode()
          assert len(data)==73
          assert hashlib.sha256(payload).hexdigest()=='5c6c7de8450ed2c365bccdb76b38f55c3f29b79151934848336dd710b727eeb5'
          print('All 73 application files exactly match the Chromium/WebKit candidate.')
          PY
      - name: Commit verified application changes to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts tests README.md package.json index.html
          git diff --cached --quiet || git commit -m 'Seal exact 73-file application verified by both browser engines [skip ci]'
          git push origin HEAD:site/closeout-20260914
