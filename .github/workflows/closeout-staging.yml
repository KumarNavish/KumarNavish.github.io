name: Seal the verified application without workflow writes
on:
  push:
    branches: [site/closeout-20260914]
permissions:
  contents: write
  actions: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: complete-reading-review-34861841940
          run-id: 34861841940
          github-token: ${{ github.token }}
          path: /tmp/verified-candidate
      - name: Verify passing receipts and restore their exact source
        run: python .delivery/seal_verified.py
      - name: Commit application files only on the existing staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts tests vendor README.md package.json index.html narrative.css .nojekyll 404.html LICENSE favicon.svg robots.txt sitemap.xml studio.css styles.css worlds.css
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --quiet || git commit -m 'Seal exact already-tested application; workflow changes remain outside CI authority [skip ci]'
          git push origin HEAD:site/closeout-20260914
          git rev-parse HEAD > /tmp/sealed-commit.txt
          git rev-parse HEAD^{tree} > /tmp/sealed-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-application-seal-${{ github.run_id }}
          path: |
            /tmp/seal-receipt.json
            /tmp/sealed-commit.txt
            /tmp/sealed-tree.txt
          retention-days: 7
