name: Diagnose inspection entry without weakening its criteria
on:
  push:
    branches: [site/closeout-20260914]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python .delivery/refine_mode.py
          python .delivery/compact_mode.py
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/inspection-http.log 2>&1 &
      - name: Observe both engines and retain all failures
        run: |
          set +e
          python .delivery/observe_inspection.py --engine chromium --url http://127.0.0.1:8765 --out /tmp/inspection-observed/chromium
          A=$?
          python .delivery/observe_inspection.py --engine webkit --url http://127.0.0.1:8765 --out /tmp/inspection-observed/webkit
          B=$?
          echo "chromium=$A webkit=$B" > /tmp/inspection-observed/outcomes.txt
          test "$A$B" = "00"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-entry-observations-${{ github.run_id }}
          path: /tmp/inspection-observed
          retention-days: 7
