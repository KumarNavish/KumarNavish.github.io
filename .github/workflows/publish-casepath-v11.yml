name: Publish CasePath v11 process workspace

on:
  push:
    branches: [casepath-deep-realism-v11]
    paths:
      - '.github/workflows/publish-casepath-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: casepath-deep-realism-v11
          fetch-depth: 0
      - name: Connect the tested decision graph to the product
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('casepath/index.html')
          text = index.read_text(encoding='utf-8')
          css_tag = '<link rel="stylesheet" href="assets/process-v11.css">'
          js_tag = '<script src="assets/process-v11.js"></script>'
          if css_tag not in text:
              text = text.replace(
                  '<link rel="stylesheet" href="assets/styles.css">',
                  '<link rel="stylesheet" href="assets/styles.css">\n  ' + css_tag,
              )
          if js_tag not in text:
              text = text.replace(
                  '<script src="assets/app.js"></script>',
                  '<script src="assets/app.js"></script>\n  ' + js_tag,
              )
          index.write_text(text, encoding='utf-8')

          release = {
              'release': '11.0.0',
              'product': 'CasePath deep process workspace',
              'demo_claim': 'DEF-027-E0-DEMO',
              'journey': 'source artifacts -> visible pipeline -> claim-specific decision tree -> process-linked evidence -> expert review -> case memory -> later claim',
              'generated_data_only': True,
          }
          Path('casepath/release.json').write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')
          PY
          node --check casepath/assets/app.js
          node --check casepath/assets/process-v11.js
          grep -q 'process-v11.css' casepath/index.html
          grep -q 'process-v11.js' casepath/index.html
          rm -f .github/workflows/publish-casepath-v11.yml
          git config user.name 'CasePath release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CasePath v11 process workspace [skip ci]'
          git push origin HEAD:casepath-deep-realism-v11
