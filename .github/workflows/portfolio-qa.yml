name: Portfolio browser acceptance
on:
  push:
    branches: [master, gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test && npm run build
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Serve checked source
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
      - name: Test real HTTP module delivery
        run: python scripts/browser_acceptance.py --url http://127.0.0.1:8765 --out /tmp/studio-local-qa
      - name: Verify the published origin
        if: github.ref == 'refs/heads/gh-pages'
        run: python scripts/browser_acceptance.py --url https://kumarnavish.github.io/ --wait-release --out /tmp/studio-live-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence-${{ github.run_id }}
          path: |
            /tmp/studio-local-qa
            /tmp/studio-live-qa
          retention-days: 1
