name: Verify published scroll-authored portfolio
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scientific invariants and reproducible HTML
        run: |
          set -o pipefail
          mkdir -p /tmp/scroll-published
          npm test | tee /tmp/scroll-published/unit-tests.txt
          npm run build
          git diff --exit-code -- index.html
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Record the actual deployed arguments forward and backward
        run: python scripts/scroll_acceptance.py --url https://kumarnavish.github.io/ --wait-release --out /tmp/scroll-published/live --record
      - name: Verify final disclosure, geometry and mobile-document regressions on production
        run: python scripts/final_scroll_checks.py --url https://kumarnavish.github.io/ --out /tmp/scroll-published/regressions
      - name: Preserve release source and verification receipt
        if: always()
        run: |
          mkdir -p /tmp/scroll-published
          git rev-parse HEAD > /tmp/scroll-published/release-commit.txt
          git rev-parse HEAD^{tree} > /tmp/scroll-published/release-tree.txt
          python -c "from pathlib import Path; import zipfile; root=Path('.'); z=zipfile.ZipFile('/tmp/scroll-published/source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,str(p)) for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ['.git','__pycache__','node_modules'])]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-scroll-narratives-${{ github.run_id }}
          path: /tmp/scroll-published
          retention-days: 7
