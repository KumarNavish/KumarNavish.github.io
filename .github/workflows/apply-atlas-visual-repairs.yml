name: apply-atlas-visual-repairs

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/workflows/apply-atlas-visual-repairs.yml'

permissions:
  contents: write

concurrency:
  group: apply-atlas-visual-repairs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Apply visual repairs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/atlas_repair.py
          python3 /tmp/atlas_repair.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install frontend dependencies
        working-directory: site
        run: npm ci

      - name: Run complete quality gates
        working-directory: site
        run: npm run check

      - name: Commit verified repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-atlas-visual-repairs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(portfolio): surface mechanisms and repair spatial motion'
          git push origin HEAD:portfolio-atlas-2026
