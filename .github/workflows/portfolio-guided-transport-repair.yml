name: portfolio guided transport repair

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/workflows/portfolio-guided-transport-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Separate guided transport from narrative scrolling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Navish portfolio release bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          scaffold = Path('site/src/chapters/ChapterScaffold.tsx')
          source = scaffold.read_text(encoding='utf-8')
          replacements = [
              (
                  '''onClick={() => setStep(props.activeStep - 1)}''',
                  '''onClick={() => setStep(props.activeStep - 1, false)}''',
              ),
              (
                  '''                      setStep(0)''',
                  '''                      setStep(0, false)''',
              ),
              (
                  '''onClick={() => setStep(props.activeStep + 1)}''',
                  '''onClick={() => setStep(props.activeStep + 1, false)}''',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected guided control fragment missing: {old!r}')
              source = source.replace(old, new, 1)
          scaffold.write_text(source, encoding='utf-8')

          acceptance = Path('site/qa/portfolio.acceptance.mjs')
          source = acceptance.read_text(encoding='utf-8')
          old_next = '''  await replay.page.getByRole('button', { name: /Next step/i }).click()\n  assert((await replay.page.locator('.chapter-stage-head span').first().textContent())?.includes('02'), 'chapter: next failed')'''
          new_next = '''  await replay.page.getByRole('button', { name: /Next step/i }).click()\n  await replay.page.waitForFunction(() =>\n    document.querySelector('.chapter-stage-head span')?.textContent?.includes('02'),\n  )'''
          old_back = '''  await replay.page.getByRole('button', { name: /Back/i }).click()\n  assert((await replay.page.locator('.chapter-stage-head span').first().textContent())?.includes('01'), 'chapter: back failed')'''
          new_back = '''  await replay.page.getByRole('button', { name: /Back/i }).click()\n  await replay.page.waitForFunction(() =>\n    document.querySelector('.chapter-stage-head span')?.textContent?.includes('01'),\n  )'''
          old_reduced = '''  await reduced.page.getByRole('button', { name: /Next step/i }).click()\n  assert((await reduced.page.locator('.chapter-stage-head span').first().textContent())?.includes('02'), 'reduced motion: sequence lost')'''
          new_reduced = '''  await reduced.page.getByRole('button', { name: /Next step/i }).click()\n  await reduced.page.waitForFunction(() =>\n    document.querySelector('.chapter-stage-head span')?.textContent?.includes('02'),\n  )'''
          for old, new in [(old_next, new_next), (old_back, new_back), (old_reduced, new_reduced)]:
              if old not in source:
                  raise SystemExit('Expected rendered acceptance assertion fragment missing.')
              source = source.replace(old, new, 1)
          acceptance.write_text(source, encoding='utf-8')
          PY

          cd site
          npm ci
          npm run typecheck
          npm run test
          npm run build
          cd ..

      - name: Commit verified repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/portfolio-guided-transport-repair.yml
          git add site/src/chapters/ChapterScaffold.tsx site/qa/portfolio.acceptance.mjs
          git commit -m 'fix(portfolio): stabilize guided transport controls'
          git push origin HEAD:portfolio-atlas-2026
