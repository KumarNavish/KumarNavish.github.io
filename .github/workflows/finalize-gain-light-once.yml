name: finalize-gain-light-once

on:
  push:
    branches: [gain-graph-light-flagship]
    paths: [gain-release.ready]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rejected surfaces and lock permanent light metadata
        run: |
          set -euo pipefail
          rm -rf \
            site/src/field \
            site/src/motion \
            site/demos/safepatch \
            site/public/safepatch
          rm -f \
            site/vite.safepatch.config.ts \
            site/scripts/prune-legacy-surfaces.mjs \
            gain-new3.part.* \
            gain-newfiles.ready \
            gain-light.part.* \
            gain-light.patch.ready \
            gain-light.patch.gz.b64
          find site/public -maxdepth 1 -type f \( -iname '*social-card*' -o -iname '*og-card*' \) ! -name 'social-card-light.svg' -delete

          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('site/package.json')
          package = json.loads(package_path.read_text())
          scripts = package.get('scripts', {})
          package['scripts'] = {
              key: value for key, value in scripts.items()
              if 'safepatch' not in key.lower()
              and 'safepatch' not in str(value).lower()
              and 'prune-legacy-surfaces' not in str(value)
          }
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          makefile = Path('Makefile')
          lines = makefile.read_text().splitlines()
          output = []
          skip_recipe = False
          for line in lines:
              if line.startswith('\t'):
                  if skip_recipe or 'safepatch' in line.lower():
                      continue
                  output.append(line)
                  continue
              skip_recipe = ':' in line and 'safepatch' in line.lower()
              if skip_recipe:
                  continue
              if 'safepatch' in line.lower():
                  continue
              output.append(line)
          makefile.write_text('\n'.join(output).rstrip() + '\n')
          PY

          cat > site/src/index.css <<'EOF'
          :root {
            color-scheme: light only;
            background: #ffffff;
            color: #111827;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
          }

          html,
          body,
          #root {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
            background: #ffffff;
            color: #111827;
          }
          EOF

          cat > site/public/site.webmanifest <<'EOF'
          {
            "name": "Navish Kumar — Research Instruments",
            "short_name": "Navish Kumar",
            "description": "A permanent-light interactive research instrument for complex unit gain graphs.",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ffffff",
            "icons": [
              {
                "src": "/favicon.svg",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any"
              }
            ]
          }
          EOF

          cat > site/public/favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#ffffff"/>
            <path d="M14 35 24 18 43 17 51 34 42 49 22 49Z" fill="none" stroke="#175ee8" stroke-width="4"/>
            <path d="M24 18 42 49M43 17 22 49" stroke="#7898df" stroke-width="2"/>
            <g fill="#ffffff" stroke="#175ee8" stroke-width="3">
              <circle cx="14" cy="35" r="4"/><circle cx="24" cy="18" r="4"/><circle cx="43" cy="17" r="4"/>
              <circle cx="51" cy="34" r="4"/><circle cx="42" cy="49" r="4"/><circle cx="22" cy="49" r="4"/>
            </g>
          </svg>
          EOF

          cat > site/public/404.html <<'EOF'
          <!doctype html>
          <html lang="en" data-theme="light">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <meta name="color-scheme" content="light only" />
              <meta name="theme-color" content="#ffffff" />
              <title>Opening research instrument…</title>
              <style>html,body{margin:0;min-height:100%;background:#fff;color:#111827;font:600 14px/1.5 system-ui,sans-serif}body{display:grid;place-items:center}</style>
              <script>
                (function () {
                  var route = location.pathname + location.search + location.hash;
                  if (location.pathname.indexOf('/bis-demo') === 0) {
                    location.replace('/bis-demo/');
                    return;
                  }
                  sessionStorage.setItem('__gain_graph_route', route);
                  location.replace('/?spa=1');
                }());
              </script>
            </head>
            <body>Opening the research instrument…</body>
          </html>
          EOF

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en" data-theme="light">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="color-scheme" content="light only" />
              <meta name="theme-color" content="#ffffff" />
              <meta name="description" content="Navish Kumar's interactive research instrument for complex unit gain graphs: cycle balance, Hermitian Laplacians, spectra, eigenmodes, heat diffusion, and frustration bounds." />
              <meta name="author" content="Navish Kumar" />
              <meta name="robots" content="index, follow" />
              <link rel="canonical" href="https://kumarnavish.github.io/" />
              <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
              <link rel="manifest" href="/site.webmanifest" />
              <meta property="og:type" content="website" />
              <meta property="og:url" content="https://kumarnavish.github.io/" />
              <meta property="og:title" content="Navish Kumar — Operate the idea, not the abstract" />
              <meta property="og:description" content="A live, permanent-light research instrument for complex unit gain graphs and their spectral structure." />
              <meta property="og:image" content="https://kumarnavish.github.io/social-card-light.svg" />
              <meta name="twitter:card" content="summary_large_image" />
              <meta name="twitter:title" content="Navish Kumar — Research instruments" />
              <meta name="twitter:description" content="Operate a complex gain graph and watch its cycles, Laplacian, spectrum, diffusion, and frustration certificate change together." />
              <meta name="twitter:image" content="https://kumarnavish.github.io/social-card-light.svg" />
              <script>
                (function () {
                  var route = sessionStorage.getItem('__gain_graph_route');
                  if (route) {
                    sessionStorage.removeItem('__gain_graph_route');
                    history.replaceState(null, '', route);
                  }
                }());
              </script>
              <script type="application/ld+json">
                {
                  "@context": "https://schema.org",
                  "@type": "Person",
                  "name": "Navish Kumar",
                  "url": "https://kumarnavish.github.io/",
                  "jobTitle": "PhD Researcher in Machine Learning",
                  "affiliation": { "@type": "Organization", "name": "University of Basel" },
                  "sameAs": [
                    "https://github.com/KumarNavish",
                    "https://scholar.google.com/citations?user=BFCHfngAAAAJ&hl=en",
                    "https://openreview.net/profile?id=~Navish_Kumar1"
                  ]
                }
              </script>
              <style>
                :root{color-scheme:light only;background:#fff}html,body,#root{min-width:320px;min-height:100%;margin:0;background:#fff;color:#111827}.initial-light-surface{min-height:100vh;display:grid;place-items:center;background:#fff;color:#111827;font:600 14px/1.5 system-ui,sans-serif}
              </style>
              <title>Navish Kumar — Interactive research instruments</title>
            </head>
            <body>
              <div id="root"><div class="initial-light-surface">Loading the gain-graph instrument…</div></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

          if grep -RIl --exclude-dir=node_modules --exclude-dir=dist -i 'safepatch' site; then
            echo 'SafePatch remains in the site source.' >&2
            exit 1
          fi
          if grep -RIl --exclude-dir=node_modules --exclude-dir=dist -E '#090b0e|color-scheme:[[:space:]]*dark|prefers-color-scheme:[[:space:]]*dark' site/src site/index.html site/public; then
            echo 'A dark-theme fallback remains in the active site.' >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run complete repository quality gates
        run: make check

      - name: Audit production artifact
        run: |
          set -euo pipefail
          test -f site/dist/index.html
          grep -q 'color-scheme:light only' site/dist/index.html
          grep -q '#ffffff' site/dist/site.webmanifest
          ! grep -R -i --exclude='*.map' 'safepatch' site/dist
          ! grep -R -E --exclude='*.map' '#090b0e|color-scheme:[[:space:]]*dark' site/dist

      - name: Install Playwright Chromium
        working-directory: site
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start SPA-aware production preview
        working-directory: site
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gain-light-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gain-light-preview.log
          exit 1

      - name: Run rendered scientific interaction QA
        working-directory: site
        run: |
          mkdir -p /tmp/gain-light-qa
          cat > /tmp/gain-light-qa/run.mjs <<'EOF'
          import { chromium } from '/home/runner/work/KumarNavish.github.io/KumarNavish.github.io/site/node_modules/@playwright/test/index.mjs'
          import fs from 'node:fs'

          const browser = await chromium.launch({ headless: true })
          const failures = []
          const result = {}
          const setRange = async (locator, value) => {
            await locator.evaluate((element, next) => {
              element.value = String(next)
              element.dispatchEvent(new Event('input', { bubbles: true }))
              element.dispatchEvent(new Event('change', { bubbles: true }))
            }, value)
          }

          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
          page.on('console', message => {
            if (message.type() === 'error' || message.type() === 'warning') failures.push(`${message.type()}: ${message.text()}`)
          })
          page.on('pageerror', error => failures.push(`pageerror: ${error.message}`))
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await page.getByRole('heading', { name: 'Operate the idea, not the abstract.' }).waitFor()
          const theme = await page.evaluate(() => ({
            body: getComputedStyle(document.body).backgroundColor,
            root: getComputedStyle(document.documentElement).backgroundColor,
            scheme: getComputedStyle(document.documentElement).colorScheme,
            overflow: document.documentElement.scrollWidth - innerWidth,
          }))
          if (theme.body !== 'rgb(255, 255, 255)' || !theme.scheme.includes('light') || theme.overflow > 1) throw new Error(JSON.stringify(theme))
          if (await page.getByText(/dark theme|dark mode/i).count()) throw new Error('Dark-theme control present')
          await page.screenshot({ path: '/tmp/gain-light-qa/desktop-hero.png' })

          await setRange(page.getByLabel('Selected edge phase perturbation').first(), 1.82)
          await page.getByText('Unbalanced', { exact: true }).first().waitFor()
          const lambda = await page.locator('.gain-hero-copy dd').nth(1).innerText()
          if (lambda === '0.000') throw new Error('Perturbation did not change λ1')

          await page.locator('#instrument').scrollIntoViewIfNeeded()
          await page.getByRole('button', { name: 'Combinatorial L' }).click()
          await page.getByText('Bound satisfied', { exact: true }).waitFor()
          if (await page.locator('.gain-matrix [role="cell"]').count() !== 36) throw new Error('Matrix is not 6×6')
          const before = await page.locator('.gain-spectrum-track button').allInnerTexts()
          await page.getByRole('button', { name: 'Change gauge' }).click()
          const after = await page.locator('.gain-spectrum-track button').allInnerTexts()
          if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error('Switching changed the spectrum')
          await page.getByRole('button', { name: 'Diffusion' }).click()
          await setRange(page.locator('.gain-time-control input[type="range"]'), 2.1)
          await page.screenshot({ path: '/tmp/gain-light-qa/desktop-instrument.png' })

          await page.locator('#evidence').scrollIntoViewIfNeeded()
          await page.getByRole('heading', { name: 'The interaction ends where the papers begin.' }).waitFor()
          await page.screenshot({ path: '/tmp/gain-light-qa/desktop-evidence.png' })

          const direct = await browser.newPage({ viewport: { width: 1280, height: 900 } })
          await direct.goto('http://127.0.0.1:4173/research/graph-laplacians', { waitUntil: 'networkidle' })
          await direct.getByRole('heading', { name: 'Operate the idea, not the abstract.' }).waitFor()
          result.directRoute = direct.url()
          await direct.close()

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } })
          mobile.on('console', message => {
            if (message.type() === 'error' || message.type() === 'warning') failures.push(`mobile ${message.type()}: ${message.text()}`)
          })
          mobile.on('pageerror', error => failures.push(`mobile pageerror: ${error.message}`))
          await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await mobile.getByRole('heading', { name: 'Operate the idea, not the abstract.' }).waitFor()
          const mobileState = await mobile.evaluate(() => ({
            body: getComputedStyle(document.body).backgroundColor,
            scheme: getComputedStyle(document.documentElement).colorScheme,
            overflow: document.documentElement.scrollWidth - innerWidth,
          }))
          if (mobileState.body !== 'rgb(255, 255, 255)' || mobileState.overflow > 1) throw new Error(JSON.stringify(mobileState))
          await mobile.screenshot({ path: '/tmp/gain-light-qa/mobile-hero.png' })
          await mobile.locator('#instrument').scrollIntoViewIfNeeded()
          await mobile.screenshot({ path: '/tmp/gain-light-qa/mobile-instrument.png' })

          result.theme = theme
          result.mobile = mobileState
          result.lambdaAfterPerturbation = lambda
          result.consoleFailures = failures
          fs.writeFileSync('/tmp/gain-light-qa/result.json', JSON.stringify(result, null, 2))
          await browser.close()
          if (failures.length) throw new Error(failures.join('\n'))
          EOF
          node /tmp/gain-light-qa/run.mjs

      - name: Upload rendered proof
        uses: actions/upload-artifact@v4
        with:
          name: gain-graph-light-flagship-proof
          path: |
            /tmp/gain-light-qa
            /tmp/gain-light-preview.log
          if-no-files-found: error
          retention-days: 5

      - name: Remove one-shot machinery and commit verified source
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-gain-light-once.yml gain-release.ready
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize the permanent-light gain-graph flagship"
          git push
