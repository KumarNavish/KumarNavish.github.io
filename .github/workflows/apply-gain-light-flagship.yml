name: apply-gain-light-flagship

on:
  push:
    branches: [gain-graph-light-flagship]
    paths: [gain-light.patch.ready]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply reviewed source patch
        run: |
          cat gain-light.patch.gz.b64.[0-9][0-9] | base64 -d | gzip -d > /tmp/gain-light.patch
          git apply --check --binary /tmp/gain-light.patch
          git apply --index --binary /tmp/gain-light.patch

      - name: Remove transfer machinery and commit implementation
        run: |
          git rm gain-light.patch.gz.b64.[0-9][0-9] gain-light.patch.ready .github/workflows/apply-gain-light-flagship.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild portfolio around a light gain-graph research instrument"
          git push
