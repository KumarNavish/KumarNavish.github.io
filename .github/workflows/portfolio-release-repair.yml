name: portfolio release repair

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - '.github/workflows/portfolio-release-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Remove unused TiC-LM prop and verify release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('site/src/chapters/CoreResearchChapters.tsx')
          source = path.read_text(encoding='utf-8')

          old_signature = """function TiCStage({
            step,
            time,
            drift,
            budget,
            values,
          }: {
            step: number
            time: number
            drift: number
            budget: number
            values: ReturnType<typeof replayValues>
          }) {"""
          new_signature = """function TiCStage({
            step,
            time,
            budget,
            values,
          }: {
            step: number
            time: number
            budget: number
            values: ReturnType<typeof replayValues>
          }) {"""
          old_call = "stage={<TiCStage step={step} time={time} drift={drift} budget={allocation} values={values} />}"
          new_call = "stage={<TiCStage step={step} time={time} budget={allocation} values={values} />}"

          if old_signature not in source:
              raise SystemExit('Expected TiCStage signature was not found; refusing an unsafe patch.')
          if old_call not in source:
              raise SystemExit('Expected TiCStage call was not found; refusing an unsafe patch.')

          source = source.replace(old_signature, new_signature, 1).replace(old_call, new_call, 1)
          path.write_text(source, encoding='utf-8')
          PY

          cd site
          npm ci
          npm run typecheck
          npm run test
          npm run build
          cd ..

      - name: Commit verified repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/portfolio-release-repair.yml
          git add site/src/chapters/CoreResearchChapters.tsx
          git config user.name 'Navish portfolio release bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'
          git commit -m 'fix(portfolio): restore release gates'
          git push origin HEAD:portfolio-atlas-2026
