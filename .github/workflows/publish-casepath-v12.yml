name: Publish CasePath v12.0.1 source

on:
  push:
    branches: [casepath-flagship-v12]
    paths:
      - '.github/workflows/publish-casepath-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: casepath-flagship-v12
          fetch-depth: 0

      - name: Verify and reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < casepath-v12-runtime-payload/part-000)" -eq 90000
          test "$(wc -c < casepath-v12-runtime-payload/part-001)" -eq 90000
          test "$(wc -c < casepath-v12-runtime-payload/part-002)" -eq 43176
          cat casepath-v12-runtime-payload/part-* > /tmp/casepath-v12-runtime.b64
          test "$(wc -c < /tmp/casepath-v12-runtime.b64)" -eq 223176
          echo '1b5301b05d2d8caaf59dd685890d30f056faebb5f20c02185c8d13747200e448  /tmp/casepath-v12-runtime.b64' | sha256sum --check
          base64 --decode /tmp/casepath-v12-runtime.b64 > /tmp/casepath-v12-runtime.tar.xz
          echo 'c691db57b637d097001594b3b8f4e449929b83595dcf862525ac6bc57178715a  /tmp/casepath-v12-runtime.tar.xz' | sha256sum --check
          rm -rf /tmp/casepath-v12-source
          mkdir -p /tmp/casepath-v12-source
          tar -xJf /tmp/casepath-v12-runtime.tar.xz -C /tmp/casepath-v12-source
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('/tmp/casepath-v12-source')
          manifest=json.loads((root/'casepath-v12-runtime-manifest.json').read_text())
          assert manifest['release']=='12.0.1'
          assert manifest['file_count']==len(manifest['files'])
          for row in manifest['files']:
              p=root/row['path']
              assert p.is_file(), row['path']
              data=p.read_bytes()
              assert len(data)==row['size'], row['path']
              assert hashlib.sha256(data).hexdigest()==row['sha256'], row['path']
          print(f"verified {len(manifest['files'])} source files")
          PY

      - name: Replace v11 runtime with exact v12.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f casepath/assets/app.js casepath/assets/styles.css casepath/assets/process-v11.css casepath/assets/process-v11.js
          rm -f casepath/tools/v11-live-qa.mjs
          rm -f casepath-api/casepath_api/data.py casepath-api/casepath_api/pipeline.py casepath-api/generate_artifacts.py
          cp -a /tmp/casepath-v12-source/. .

      - name: Build artifacts and verify application contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r casepath-api/requirements.txt pytest
          python casepath-api/generate_flagship_v12.py
          test "$(cat casepath-api/artifacts/.flagship-v12)" = '12.0.1'
          python -m compileall -q casepath-api/casepath_api casepath-api/generate_flagship_v12.py
          node --check casepath/assets/flagship-v12-bootstrap.js
          node --check casepath/assets/flagship-v12-core.js
          node --check casepath/assets/flagship-v12.js
          node --check casepath/tools/v12-live-qa.mjs
          PYTHONPATH=casepath-api CASEPATH_DB_PATH=/tmp/casepath-v12-ci.db python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path=Path('casepath-api/tests/test_flagship_v12.py')
          spec=importlib.util.spec_from_file_location('v12tests', path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names=sorted(name for name in dir(module) if name.startswith('test_'))
          for name in names:
              print('RUN', name, flush=True)
              getattr(module, name)()
              print('PASS', name, flush=True)
          module.client.close()
          print(f'PASS {len(names)} contract tests', flush=True)
          os._exit(0)
          PY
          rm -rf casepath-api/artifacts casepath-api/.pytest_cache casepath-api/tests/__pycache__ casepath-api/casepath_api/__pycache__
          rm -f /tmp/casepath-v12-ci.db /tmp/casepath-v12-ci.db-shm /tmp/casepath-v12-ci.db-wal

      - name: Commit reconstructed release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf casepath-v12-upload casepath-v12-small casepath-v12-runtime-payload
          rm -f .github/workflows/publish-casepath-v12.yml
          git config user.name 'CasePath release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CasePath v12.0.1 with photographic evidence [skip ci]'
          git push origin HEAD:casepath-flagship-v12
