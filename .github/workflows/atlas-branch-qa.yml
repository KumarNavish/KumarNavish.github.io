name: atlas branch QA

on:
  push:
    branches: [portfolio-atlas-2026]
    paths:
      - .github/workflows/atlas-branch-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout atlas branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-atlas-2026
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Apply deterministic source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('site/src/RoutedApplication.tsx'): [
                  ("behavior: 'instant'", "behavior: 'auto'"),
              ],
              Path('site/src/chapters/CoreResearchChapters.tsx'): [
                  ("opacity={index>time?.25:1}", "opacity={index > time ? .25 : 1}"),
              ],
              Path('site/src/chapters/AppliedResearchChapters.tsx'): [
                  ("  type ChapterEvidence,\n", ""),
              ],
              Path('site/src/spatial/SpatialLabPage.tsx'): [
                  ("  type SceneObjectKind,\n", ""),
              ],
              Path('site/src/atlas/AtlasPage.tsx'): [
                  ("useState, type CSSProperties, type ReactNode", "useState, type ComponentType, type CSSProperties"),
                  ("Preview: (props: PreviewProps) => ReactNode", "Preview: ComponentType<PreviewProps>"),
                  ("  return (\n    <article className=\"atlas-entry\"", "  const Preview = entry.Preview\n  return (\n    <article className=\"atlas-entry\""),
                  ("{entry.Preview({ active })}", "<Preview active={active} />"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected source fragment in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Format authored surface
        working-directory: site
        run: >-
          npx prettier --write
          src/App.tsx
          src/RoutedApplication.tsx
          src/shared/PortfolioShell.tsx
          src/shared/portfolio.css
          src/atlas/AtlasPage.tsx
          src/atlas/atlas.css
          src/chapters/ChapterScaffold.tsx
          src/chapters/CoreResearchChapters.tsx
          src/chapters/AppliedResearchChapters.tsx
          src/chapters/chapters.css
          src/spatial/sceneParser.ts
          src/spatial/sceneParser.test.ts
          src/spatial/SpatialLabPage.tsx
          src/spatial/spatialLab.css
          index.html

      - name: Run full repository gates and preserve report
        id: qa
        shell: bash
        run: |
          set +e
          : > ATLAS_QA.log
          status=0
          run_check() {
            echo "" | tee -a ATLAS_QA.log
            echo "### $*" | tee -a ATLAS_QA.log
            "$@" 2>&1 | tee -a ATLAS_QA.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status="$code"; fi
          }
          run_check make pipe-validate-registry
          run_check make site-typecheck
          run_check make check
          if [ "$status" -eq 0 ]; then
            echo "ATLAS_QA_STATUS=PASS" | tee -a ATLAS_QA.log
          else
            echo "ATLAS_QA_STATUS=FAIL" | tee -a ATLAS_QA.log
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repairs and QA report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/atlas-branch-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(portfolio): format and validate interactive atlas"
            git push origin HEAD:portfolio-atlas-2026
          fi

      - name: Enforce QA result
        if: steps.qa.outputs.status != '0'
        run: exit "${{ steps.qa.outputs.status }}"
