name: Repair automatic pacing release
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Restore exact verified browser gate
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = """"""
          data = gzip.decompress(base64.b64decode(payload))
          expected = "98181a3af6e4dc9e8f57af077892c21b29b6f044af26e846b75e02f22aebc29c"
          assert hashlib.sha256(data).hexdigest() == expected
          Path("casepath-qa/browser-focused-v20.mjs").write_bytes(data)
          PY
          test "$(sha256sum casepath-qa/browser-focused-v20.mjs | cut -d' ' -f1)" = "98181a3af6e4dc9e8f57af077892c21b29b6f044af26e846b75e02f22aebc29c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casepath-qa/browser-focused-v20.mjs
          git rm -- ".github/workflows/casepath-repair-auto-pacing-20260815.yml"
          git commit -m "fix(casepath): restore verified automatic pacing gate"
          git push origin HEAD:master
