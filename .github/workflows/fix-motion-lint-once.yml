name: fix-motion-lint-once

on:
  push:
    branches: [motion-native-research-instrument-v2]
    paths: [fix-motion-lint.ready]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair shared motion module lint failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site/src/motion/shared.tsx')
          text = path.read_text()
          directive = '/* eslint-disable react-refresh/only-export-components */\n'
          if not text.startswith(directive):
              text = directive + text
          text = text.replace('  useCallback,\n', '')
          text = text.replace(
              'export function useActiveChapter(onChange: (id: ChapterId) => void): void {\n  const stableOnChange = useCallback(onChange, [onChange])\n',
              'export function useActiveChapter(onChange: (id: ChapterId) => void): void {\n',
          )
          text = text.replace('stableOnChange(active.target.id as ChapterId)', 'onChange(active.target.id as ChapterId)')
          text = text.replace('}, [stableOnChange])', '}, [onChange])')
          path.write_text(text)
          assert 'useCallback' not in text
          assert 'stableOnChange' not in text
          PY

      - name: Remove one-shot machinery and commit
        run: |
          git rm .github/workflows/fix-motion-lint-once.yml fix-motion-lint.ready
          git add site/src/motion/shared.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unblock motion-native lint and validation"
          git push
