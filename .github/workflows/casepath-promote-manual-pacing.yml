name: Promote CasePath manual pacing
on:
  push:
    branches:
      - codex/promote-manual-pacing-20260815
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ccc09eb75369e756d823742906e541e752a946d1"
          printf '%s' '' | base64 -d > /tmp/casepath.patch
          echo "a8367a74a50899efc6a56fa92ca8f7656db9ccf9634f290b2d6de7366d216ff1  /tmp/casepath.patch" | sha256sum -c -
          git apply --binary --index /tmp/casepath.patch
          test "$(git write-tree)" = "9fc97c8a858f61129a1929ccc22374fd5bb15afc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(casepath): let viewers control evidence pacing"
          git push origin HEAD:master
