name: promote-motion-native

on:
  push:
    branches: [motion-native-research-instrument-v2]
    paths: [promote-motion-native.ready]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify rendered proof contract
        run: |
          test -f review/motion-native-qa/qa-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('review/motion-native-qa/qa-result.json').read_text())
          assert result.get('passed') is True, result
          assert result['desktop']['browserMessages'] == [], result['desktop']
          assert result['mobile']['browserMessages'] == [], result['mobile']
          assert result['desktop']['measurements']['overflow'] <= 1
          assert result['mobile']['measurements']['overflow'] <= 1
          PY

      - name: Audit screenshot evidence
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          root = Path('review/motion-native-qa')
          expected = {
              'desktop-entry.png': (1440, 1000),
              'desktop-graph.png': (1440, 1000),
              'desktop-replay.png': (1440, 1000),
              'desktop-rank.png': (1440, 1000),
              'desktop-temporal.png': (1440, 1000),
              'desktop-casepath-failed.png': (1440, 1000),
              'desktop-spatial.png': (1440, 1000),
              'mobile-entry.png': (390, 844),
              'mobile-replay.png': (390, 844),
          }
          images = {}
          for name, size in expected.items():
              path = root / name
              assert path.exists(), f'missing {name}'
              image = Image.open(path).convert('RGB')
              assert image.size == size, (name, image.size, size)
              stat = ImageStat.Stat(image)
              mean = sum(stat.mean) / 3
              spread = sum(stat.stddev) / 3
              colors = image.resize((320, 220)).getcolors(320 * 220)
              assert 7 < mean < 190, (name, mean)
              assert spread > 12, (name, spread)
              assert colors is None or len(colors) > 450, (name, len(colors or []))
              images[name] = image.resize((320, 220))

          desktop_names = [name for name in expected if name.startswith('desktop-')]
          for index, left_name in enumerate(desktop_names):
              for right_name in desktop_names[index + 1:]:
                  diff = ImageChops.difference(images[left_name], images[right_name])
                  rms = sum(v * v for v in ImageStat.Stat(diff).rms) ** 0.5
                  assert rms > 8, f'{left_name} and {right_name} are visually indistinct: {rms}'
          PY

      - name: Remove SafePatch source and transient review machinery
        run: |
          git rm -r --ignore-unmatch site/demos/safepatch site/public/safepatch site/vite.safepatch.config.ts
          git rm -r review/motion-native-qa
          git rm -f promote-motion-native.ready .github/workflows/promote-motion-native.yml
          git rm -f .github/workflows/motion-native-preview.yml .github/workflows/motion-native-proof.yml || true
          git rm -f motion-native-proof.ready motion-fixes.patch motion-polish.ready || true
          git rm -f .github/workflows/apply-motion-fixes.yml .github/workflows/apply-motion-polish.yml || true

      - name: Update production metadata
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('site/index.html')
          text = path.read_text()
          text = re.sub(r'<title>.*?</title>', '<title>Navish Kumar — Interactive Research Instruments</title>', text, count=1, flags=re.S)
          replacements = {
              'theme-color': '#090b0e',
              'color-scheme': 'dark',
              'description': 'Interactive research instruments by Navish Kumar: graph Laplacians, continual learning, constrained adaptation, temporal replay, bounded agents, and spatial intelligence.',
          }
          for name, content in replacements.items():
              pattern = rf'(<meta\s+name="{re.escape(name)}"\s+content=")[^"]*(")'
              text = re.sub(pattern, rf'\g<1>{content}\g<2>', text, count=1)
          text = re.sub(r'(<meta\s+property="og:title"\s+content=")[^"]*(")', r'\g<1>Navish Kumar — Interactive Research Instruments\g<2>', text, count=1)
          text = re.sub(r'(<meta\s+property="og:description"\s+content=")[^"]*(")', r'\g<1>Encounter the mechanisms directly: live scientific and agentic systems with source-bound evidence and explicit limits.\g<2>', text, count=1)
          text = re.sub(r'(<meta\s+name="twitter:title"\s+content=")[^"]*(")', r'\g<1>Navish Kumar — Interactive Research Instruments\g<2>', text, count=1)
          text = re.sub(r'(<meta\s+name="twitter:description"\s+content=")[^"]*(")', r'\g<1>Live mechanisms for learning under change, bounded agents, and spatial intelligence.\g<2>', text, count=1)
          path.write_text(text)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Re-run complete repository gates after cleanup
        run: make check

      - name: Commit production-ready source
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize motion-native research instrument"
          git push
          echo "PROMOTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for pull-request checks on final head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --head motion-native-research-instrument-v2 --state open --json number --jq '.[0].number')
          test -n "$pr_number"
          for attempt in $(seq 1 90); do
            payload=$(gh api "repos/${{ github.repository }}/commits/${PROMOTION_SHA}/check-runs")
            state=$(python3 -c 'import json,sys; d=json.load(sys.stdin); checks=d.get("check_runs",[]); named=[c for c in checks if c.get("name")=="check"]; print("success" if named and all(c.get("status")=="completed" and c.get("conclusion")=="success" for c in named) else "failure" if any(c.get("status")=="completed" and c.get("conclusion") not in ("success","neutral","skipped") for c in named) else "waiting")' <<< "$payload")
            if [ "$state" = success ]; then
              echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$state" = failure ]; then
              gh pr checks "$pr_number" --repo "${{ github.repository }}"
              exit 1
            fi
            sleep 8
          done
          echo 'Timed out waiting for final-head checks.'
          exit 1

      - name: Merge validated portfolio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --subject "Rebuild portfolio as a motion-native research instrument" \
            --body "Publish six computation-backed research chapters, source-bound evidence, deterministic failure states, accessible motion, and the complete removal of SafePatch from the production product and build."
