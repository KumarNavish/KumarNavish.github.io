name: Verify authored living worlds
on:
  push:
    branches: [site/living-worlds-20260913]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover pinned renderer with license
        run: |
          mkdir -p /tmp/world-vendor "$GITHUB_WORKSPACE/vendor"
          cd /tmp/world-vendor
          npm pack three@0.180.0 --json > package-receipt.json
          tar -xzf three-0.180.0.tgz
          cp package/build/three.module.min.js package/build/three.core.min.js "$GITHUB_WORKSPACE/vendor/"
          cp package/examples/jsm/controls/OrbitControls.js package/examples/jsm/environments/RoomEnvironment.js "$GITHUB_WORKSPACE/vendor/"
          cp package/LICENSE "$GITHUB_WORKSPACE/vendor/THREE-LICENSE.txt"
          sed -i "s/from 'three'/from '.\/three.module.min.js'/g" "$GITHUB_WORKSPACE/vendor/OrbitControls.js" "$GITHUB_WORKSPACE/vendor/RoomEnvironment.js"
      - name: Materialize baseline then verify the authored refinement
        run: python .delivery/refine.py
      - name: Test mathematical and state invariants
        run: |
          set -o pipefail
          mkdir -p /tmp/worlds-review
          npm test | tee /tmp/worlds-review/unit-tests.txt
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Serve source without changing browser policy
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/worlds-http.log 2>&1 &
      - name: Exercise rendered worlds over HTTP
        run: python scripts/worlds_acceptance.py --url http://127.0.0.1:8765 --out /tmp/worlds-review/browser
      - name: Seal verified files on staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts tests vendor index.html worlds.css README.md package.json
          git diff --cached --quiet || git commit -m 'Seal refined living worlds after source-hash and browser verification [skip ci]'
          git push origin HEAD:site/living-worlds-20260913
      - name: Preserve source and evidence even after a failed check
        if: always()
        run: |
          mkdir -p /tmp/worlds-review
          cp /tmp/worlds-http.log /tmp/worlds-review/http.log 2>/dev/null || true
          python -c "from pathlib import Path; import zipfile; root=Path('.'); z=zipfile.ZipFile('/tmp/worlds-review/source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,str(p)) for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ['.git','__pycache__','node_modules'])]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-living-worlds-${{ github.run_id }}
          path: /tmp/worlds-review
          retention-days: 7
