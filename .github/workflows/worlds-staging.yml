name: Seal the verified living-world source
on:
  push:
    branches: [site/living-worlds-20260913]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct only the exact source already tested in run 34812982588
        run: python .delivery/finalize.py
      - name: Commit application contents only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts tests vendor index.html worlds.css README.md package.json
          if git diff --cached --name-only | grep '^.github/'; then
            echo 'Refusing to include workflow changes in this contents-only commit'
            exit 1
          fi
          git diff --cached --quiet || git commit -m 'Seal exact application bytes verified by 63 unit and 127 browser checks [skip ci]'
          git push origin HEAD:site/living-worlds-20260913
          git rev-parse HEAD > /tmp/worlds-review/sealed-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-worlds-source-seal-${{ github.run_id }}
          path: /tmp/worlds-review
          retention-days: 7
