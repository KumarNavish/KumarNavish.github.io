name: patch radical redesign mechanism identity

on:
  push:
    branches: [portfolio-radical-redesign-20260831]
    paths:
      - '.github/workflows/patch-radical-redesign-mechanism-identity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-radical-redesign-20260831
          fetch-depth: 0
      - name: Expose stable mechanism identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('site/src/rebuilt/ProjectStages.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'return <div className={className} data-mechanism={workId} data-step={boundedStep}>{visual}</div>'
          new = 'return <div className={className} data-mechanism={workId} data-project-mechanism={workId} data-step={boundedStep}>{visual}</div>'
          if old not in text:
              raise SystemExit('mechanism identity patch target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'Navish portfolio redesign bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'
          git add site/src/rebuilt/ProjectStages.tsx
          git commit -m 'fix(portfolio): expose stable project mechanism identity'
          git push origin HEAD:portfolio-radical-redesign-20260831
