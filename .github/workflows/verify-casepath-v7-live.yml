name: Verify CasePath v7 live experience

on:
  push:
    branches: [master]
    paths:
      - 'casepath/index.html'
      - 'casepath/health.json'
      - 'casepath/release.json'
      - 'casepath/data/manifest.json'
      - '.github/workflows/verify-casepath-v7-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-product:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CASEPATH_URL: https://casepath-swiss-claim-lab.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the canonical Render deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --retry 2 --retry-all-errors --connect-timeout 20 --max-time 90 -fsSL "$CASEPATH_URL/health.json?release=7.0.0" | grep -q '"release": "7.0.0"'; then
              echo "CasePath v7 is live"
              exit 0
            fi
            echo "Waiting for Render deployment ($attempt/40)"
            sleep 10
          done
          echo "CasePath v7 did not become live in time" >&2
          exit 1

      - name: Verify public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p casepath/reports/v7-live
          for asset in / /health.json /release.json /data/manifest.json; do
            code=$(curl --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -LsS -o /tmp/casepath-asset -w '%{http_code}' "$CASEPATH_URL$asset?v=7.0.0")
            test "$code" = 200
          done
          curl -fsSL "$CASEPATH_URL/?v=7.0.0" -o /tmp/live-index.html
          grep -F '<title>CasePath — Claim workspace</title>' /tmp/live-index.html
          grep -F 'Where it is blocked' /tmp/live-index.html
          echo '231c7ecbde9d2f635d7aa59c51df04878504e3c75772860601e240584f3c1cd8  /tmp/live-index.html' | sha256sum --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Exercise the deployed employee journey
        shell: bash
        run: |
          cat > /tmp/verify-casepath-v7.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const root=process.env.CASEPATH_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          const page=await context.newPage();
          const errors=[]; const checks=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
          page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
          const check=(name,value,detail='')=>{checks.push({name,passed:Boolean(value),detail});if(!value)throw new Error(`${name}: ${detail}`)};
          const go=async hash=>{const r=await page.goto(`${root}/?v=7.0.0${hash||''}`,{waitUntil:'networkidle',timeout:120000});check(`HTTP 200 ${hash||'/'}`,r?.status()===200,String(r?.status()));};

          await go('#/new');
          check('Minimal navigation',(await page.locator('.global-nav button').count())===3);
          check('One primary intake action',(await page.locator('form .btn.primary').count())===1);
          await page.screenshot({path:'casepath/reports/v7-live/01-new-claim-1440x900.png',fullPage:false});
          await page.getByRole('button',{name:'Analyse claim'}).click();
          await page.getByRole('heading',{name:'Recurring mould after renovation'}).waitFor({timeout:20000});
          check('Blocker visible',(await page.getByText('blocked because the cause of the recurring mould is not yet supported.').count())===1);
          check('Process prominence',(await page.getByRole('heading',{name:'Where it is blocked'}).count())===1);
          check('Current question',(await page.getByText('What caused the recurring mould?',{exact:true}).count())===1);
          check('No old sidebar',(await page.locator('.sidebar,.side').count())===0);
          check('No repeated Inspect buttons',(await page.getByRole('button',{name:'Inspect',exact:true}).count())===0);
          await page.screenshot({path:'casepath/reports/v7-live/02-workspace-1440x900.png',fullPage:false});

          await page.locator('[data-process="1"]').click();
          check('Contextual process detail',(await page.getByText('Is urgent protective action needed?',{exact:true}).count())===1);
          await page.locator('[data-process="4"]').click();
          await page.getByRole('button',{name:'Why?'}).first().click();
          check('Evidence-to-process explanation',(await page.getByRole('heading',{name:'Why Independent inspection report?'}).count())===1);
          await page.keyboard.press('Escape');

          await page.getByRole('button',{name:'Audit trail'}).click();
          check('Unified audit trail',(await page.getByText('Deterministic validation',{exact:true}).count())===1);
          await page.screenshot({path:'casepath/reports/v7-live/03-audit-trail.png',fullPage:false});
          await page.keyboard.press('Escape');

          await page.locator('[data-scroll="review"]').click();
          await page.getByRole('button',{name:'Review result'}).click();
          await page.locator('#reviewNote').fill('Keep medical evidence conditional until symptoms are supported.');
          await page.getByRole('button',{name:'Save review'}).click();
          check('Review saved locally',(await page.getByText('Review saved for this claim. Shared knowledge has not changed.').count())===1);

          await page.locator('[data-route="claims"]').first().click();
          check('Calm inbox',(await page.locator('.claim-row:not(.header)').count())===8);
          await page.screenshot({path:'casepath/reports/v7-live/04-claims-inbox.png',fullPage:false});
          await page.locator('#claimSearch').fill('heating');
          check('Inbox search',(await page.locator('.claim-row:not(.header)').count())===1);

          await page.locator('[data-route="knowledge"]').first().click();
          check('Knowledge surface',(await page.locator('.knowledge-section').count())===3);
          await page.locator('[data-route="system"]').first().click();
          check('System contracts',(await page.locator('.module-row').count())===7);

          await go('#/state/offline');
          check('Offline state',(await page.getByRole('heading',{name:'You are offline'}).count())===1);
          await go('#/state/quota');
          check('Quota state',(await page.getByRole('heading',{name:'Today’s live-analysis limit is reached'}).count())===1);

          await page.setViewportSize({width:390,height:844});
          await go('#/claim/NEW-BS-2026-001');
          const overflow390=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          check('390px no overflow',overflow390<=1,String(overflow390));
          check('Mobile navigation',await page.locator('.mobile-bottom').isVisible());
          await page.screenshot({path:'casepath/reports/v7-live/05-workspace-390x844.png',fullPage:false});

          await page.setViewportSize({width:320,height:700});
          await go('#/claim/NEW-BS-2026-001');
          const overflow320=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          check('320px no overflow',overflow320<=1,String(overflow320));
          await page.screenshot({path:'casepath/reports/v7-live/06-workspace-320x700.png',fullPage:false});
          check('No browser errors',errors.length===0,errors.join('; '));

          const report={url:root,release:'7.0.0',verifiedAt:new Date().toISOString(),passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,checks,errors};
          fs.writeFileSync('casepath/reports/v7-live/browser-qa.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node /tmp/verify-casepath-v7.mjs

      - name: Commit live QA evidence
        shell: bash
        run: |
          git config user.name 'CasePath live verification'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin master
          git add casepath/reports/v7-live
          git commit -m 'Add CasePath v7 live QA evidence [skip ci]'
          git push origin HEAD:master
