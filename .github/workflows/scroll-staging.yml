name: Verify final mobile document reading bands
on:
  push:
    branches: [site/scroll-narrative-20260914]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed layout correction with source hashes
        run: python .delivery/case_layout.py
      - name: Preserve the scientific invariants
        run: npm test
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Serve the exact source
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/case-http.log 2>&1 &
      - name: Verify every mobile document band and the final regression paths
        run: python scripts/final_scroll_checks.py --url http://127.0.0.1:8765 --out /tmp/scroll-mobile
      - name: Seal tested application-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add narrative.css scripts/final_scroll_checks.py
          git diff --cached --quiet || git commit -m 'Prevent mobile source cards from overlapping derived checks; add measured non-overlap assertions [skip ci]'
          git push origin HEAD:site/scroll-narrative-20260914
      - name: Preserve evidence and exact source
        if: always()
        run: |
          mkdir -p /tmp/scroll-mobile
          python -c "from pathlib import Path; import zipfile; root=Path('.'); z=zipfile.ZipFile('/tmp/scroll-mobile/source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,str(p)) for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ['.git','.delivery','__pycache__','node_modules'])]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reading-bands-${{ github.run_id }}
          path: /tmp/scroll-mobile
          retention-days: 7
