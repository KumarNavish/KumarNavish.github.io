name: Materialize immersive portfolio atlas

on:
  push:
    branches:
      - portfolio-immersive-atlas-2026
    paths:
      - portfolio-atlas-payload.tar.zst.b64
      - .github/workflows/materialize-immersive-atlas.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-immersive-atlas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decode and install portfolio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-payload site/public/portfolio
          base64 --decode portfolio-atlas-payload.tar.zst.b64 > /tmp/portfolio-atlas-payload.tar.zst
          zstd --decompress --stdout /tmp/portfolio-atlas-payload.tar.zst > /tmp/portfolio-atlas-payload.tar
          tar -xf /tmp/portfolio-atlas-payload.tar -C /tmp/atlas-payload

          install -m 0644 /tmp/atlas-payload/index.html site/index.html
          install -m 0644 /tmp/atlas-payload/portfolio/atlas.css site/public/portfolio/atlas.css
          install -m 0644 /tmp/atlas-payload/portfolio/atlas.js site/public/portfolio/atlas.js
          install -m 0644 /tmp/atlas-payload/PORTFOLIO_ATLAS_UX_RATIONALE.md PORTFOLIO_ATLAS_UX_RATIONALE.md

          node --check site/public/portfolio/atlas.js
          test -s site/index.html
          test -s site/public/portfolio/atlas.css
          test -s site/public/portfolio/atlas.js

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html site/public/portfolio/atlas.css site/public/portfolio/atlas.js PORTFOLIO_ATLAS_UX_RATIONALE.md; then
            echo "The immersive atlas is already materialized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/public/portfolio/atlas.css site/public/portfolio/atlas.js PORTFOLIO_ATLAS_UX_RATIONALE.md
          git commit -m "feat(portfolio): build immersive research atlas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
