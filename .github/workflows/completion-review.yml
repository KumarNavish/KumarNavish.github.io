name: Verify input ownership and final scientific annotations
on:
  push:
    branches: [site/end-to-end-20260914]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and refine exact authored source
        run: |
          python .delivery/apply_completion.py
          python .delivery/apply_reading.py
          python .delivery/input_race.py
          python .delivery/finish_interaction.py
      - name: Verify numerical, state and annotation invariants
        run: |
          set -o pipefail
          mkdir -p /tmp/completion-review
          npm test | tee /tmp/completion-review/unit-tests.txt
      - run: python -m pip install playwright==1.57.0 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Serve source without changing browser policies
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/completion-http.log 2>&1 &
      - name: Test the reproduced reflow race in both engines
        run: |
          python scripts/scroll_race_checks.py --url http://127.0.0.1:8765 --out /tmp/completion-review/race-webkit
          python scripts/scroll_race_checks.py --engine chromium --url http://127.0.0.1:8765 --out /tmp/completion-review/race-chromium
      - name: Verify visitor paths in Chromium
        run: python scripts/completion_acceptance.py --url http://127.0.0.1:8765 --out /tmp/completion-review/completion
      - name: Repeat untraced WebKit visitor paths
        run: |
          for run in 1 2 3; do
            python scripts/completion_acceptance.py --engine webkit --url http://127.0.0.1:8765 --out /tmp/completion-review/webkit-$run || exit 1
          done
      - name: Measure annotations against actual overlays at final display sizes
        run: python scripts/annotation_checks.py --url http://127.0.0.1:8765 --out /tmp/completion-review/annotations
      - name: Recheck disclosure and compact evidence layout
        run: python scripts/final_scroll_checks.py --url http://127.0.0.1:8765 --out /tmp/completion-review/regressions
      - name: Recheck all reversible scientific arguments
        run: python scripts/scroll_acceptance.py --url http://127.0.0.1:8765 --out /tmp/completion-review/browser
      - name: Seal only verified application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts tests index.html narrative.css README.md package.json
          git diff --cached --quiet || git commit -m 'Seal completed portfolio with single scroll ownership and collision-aware annotations [skip ci]'
          git push origin HEAD:site/end-to-end-20260914
      - name: Preserve evidence and exact source even on failure
        if: always()
        run: |
          mkdir -p /tmp/completion-review
          cp /tmp/completion-http.log /tmp/completion-review/http.log 2>/dev/null || true
          git rev-parse HEAD > /tmp/completion-review/source-ref.txt
          python -c "from pathlib import Path; import zipfile; root=Path('.'); z=zipfile.ZipFile('/tmp/completion-review/source.zip','w',zipfile.ZIP_DEFLATED); [z.write(p,str(p)) for p in root.rglob('*') if p.is_file() and not any(x in p.parts for x in ['.git','.delivery','__pycache__','node_modules'])]; z.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-completion-review-${{ github.run_id }}
          path: /tmp/completion-review
          retention-days: 7
