name: apply deep route redesign

on:
  push:
    branches: [portfolio-radical-redesign-20260831]
    paths:
      - '.redesign/deep-route-redesign.tar.xz'
      - '.github/workflows/apply-deep-route-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-radical-redesign-20260831
          fetch-depth: 0
      - name: Materialize and validate the final deep-route redesign
        shell: bash
        run: |
          set -euo pipefail
          xz -t .redesign/deep-route-redesign.tar.xz
          mkdir -p /tmp/deep-route-redesign
          xz -dc .redesign/deep-route-redesign.tar.xz | tar -xvf - -C /tmp/deep-route-redesign
          test -s /tmp/deep-route-redesign/site/src/chapters/ChapterScaffold.tsx
          test -s /tmp/deep-route-redesign/site/src/chapters/chapters.css
          test -s /tmp/deep-route-redesign/site/src/rebuilt/ResearchProgrammePages.tsx
          test -s /tmp/deep-route-redesign/site/src/shared/portfolio.css
          cp -R /tmp/deep-route-redesign/site/src/chapters/ChapterScaffold.tsx site/src/chapters/ChapterScaffold.tsx
          cp -R /tmp/deep-route-redesign/site/src/chapters/chapters.css site/src/chapters/chapters.css
          cp -R /tmp/deep-route-redesign/site/src/rebuilt/ResearchProgrammePages.tsx site/src/rebuilt/ResearchProgrammePages.tsx
          cp -R /tmp/deep-route-redesign/site/src/shared/portfolio.css site/src/shared/portfolio.css
          git config user.name 'Navish portfolio redesign bot'
          git config user.email '43814868+KumarNavish@users.noreply.github.com'
          git add site/src/chapters/ChapterScaffold.tsx site/src/chapters/chapters.css site/src/rebuilt/ResearchProgrammePages.tsx site/src/shared/portfolio.css
          git commit -m 'Redesign every research chapter around one active scientific stage'
          git push origin HEAD:portfolio-radical-redesign-20260831
