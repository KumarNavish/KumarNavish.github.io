<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafePatch Geometry</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">SafePatch Geometry</p>
        <h1>Unsafe optimizer updates are projected into a shippable guardrail zone.</h1>
        <p class="hero-sub">Red is raw intent. Blue is the closest safe action.</p>
      </header>

      <section class="plot-card">
        <div class="plot-top">
          <div class="status-group">
            <span id="ship-indicator" class="indicator hold">HOLD</span>
            <p id="ship-reason" class="ship-reason">Computing projection...</p>
          </div>

          <div class="meta-group">
            <span id="equation-chip" class="equation-chip"></span>
            <button id="replay-button" class="replay" type="button">Replay</button>
          </div>
        </div>

        <canvas id="scene-canvas" class="scene" aria-label="SafePatch projection scene"></canvas>

        <p id="phase-caption" class="phase-caption">Initializing animation...</p>

        <div class="kpi-row" aria-label="summary metrics">
          <article>
            <h3>Raw breach</h3>
            <p id="metric-raw-violation" class="metric">+0.000</p>
          </article>
          <article>
            <h3>Safe breach</h3>
            <p id="metric-safe-violation" class="metric">+0.000</p>
          </article>
          <article>
            <h3>Signal kept</h3>
            <p id="metric-retained" class="metric">100.0%</p>
          </article>
        </div>
      </section>

      <section class="control-rail">
        <label class="control">
          <div class="control-head">
            <span>Patch intensity</span>
            <span id="eta-value" class="value">1.00</span>
          </div>
          <input id="eta-slider" type="range" min="0.55" max="1.45" step="0.01" value="1.00" />
          <div class="control-scale"><span>small step</span><span>aggressive step</span></div>
        </label>

        <label class="control">
          <div class="control-head">
            <span>Guardrail strictness</span>
            <span id="strictness-value" class="value">Balanced · 1.00x</span>
          </div>
          <input id="strictness-slider" type="range" min="0.75" max="1.30" step="0.01" value="1.00" />
          <div class="control-scale"><span>tight zone</span><span>loose zone</span></div>
        </label>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
