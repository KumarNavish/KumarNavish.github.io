<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafePatch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">SafePatch Deployment Gate</p>
        <h1>AI corrects risky LLM hotfixes before they trigger queue incidents.</h1>
      </header>

      <section class="stage">
        <div class="top-row">
          <div class="scenario-buttons" role="group" aria-label="Traffic scenario">
            <button class="scenario-btn" data-pressure="0.25" type="button">Low traffic</button>
            <button class="scenario-btn active" data-pressure="0.55" type="button">Peak hour</button>
            <button class="scenario-btn" data-pressure="0.9" type="button">Incident surge</button>
          </div>
          <button id="export-button" class="export" type="button">Apply policy (export JSON)</button>
        </div>

        <div class="canvas-shell">
          <canvas id="scene-canvas" class="scene" aria-label="Queue stabilization replay"></canvas>
        </div>

        <p id="recommendation-line" class="recommendation-line">
          SafePatch replay running.
        </p>

        <div class="kpi-row" aria-label="Operational impact">
          <article class="kpi-card">
            <p>Peak queue (raw -> SafePatch)</p>
            <strong id="kpi-peak-value">--</strong>
          </article>
          <article class="kpi-card">
            <p>Breach minutes (raw -> SafePatch)</p>
            <strong id="kpi-breach-value">--</strong>
          </article>
          <article class="kpi-card">
            <p>Escalations (raw -> SafePatch)</p>
            <strong id="kpi-escalations-value">--</strong>
          </article>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
