<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Opening Navish Kumar’s portfolio…</title>
    <style>html,body{margin:0;min-height:100%;background:#fff;color:#111310;font:600 14px/1.5 system-ui,sans-serif}body{display:grid;place-items:center}</style>
    <script>
      ;(function () {
        var route = location.pathname + location.search + location.hash
        if (location.pathname.indexOf('/bis-demo') === 0) {
          location.replace('/bis-demo/')
          return
        }
        sessionStorage.setItem('__portfolio_route', route)
        location.replace('/?spa=1')
      })()
    </script>
  </head>
  <body>Opening the requested portfolio route…</body>
</html>
