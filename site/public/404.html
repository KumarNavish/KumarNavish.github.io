<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <script>
      ;(() => {
        const current = new URL(window.location.href)
        if (!current.pathname.startsWith('/bis-continual-process-automation-demo')) {
          return
        }

        const destination = new URL('https://kumarnavish.github.io/promopilot/')
        destination.search = current.search
        destination.hash = current.hash
        window.location.replace(destination.toString())
      })()
    </script>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2a3a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fb;
      }
      main {
        width: min(560px, calc(100% - 2rem));
        border: 1px solid #d8e0eb;
        border-radius: 12px;
        background: #fff;
        padding: 1.1rem;
      }
      h1 {
        margin: 0;
        font-size: 1.3rem;
      }
      p {
        margin: 0.55rem 0 0;
      }
      a {
        color: #1a4f8f;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This link no longer exists.</p>
      <p>Go to <a href="https://kumarnavish.github.io/promopilot/">PromoPilot</a>.</p>
    </main>
  </body>
</html>
