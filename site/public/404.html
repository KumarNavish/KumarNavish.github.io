<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Opening the research instrument</title>
    <script>
      ;(() => {
        const current = new URL(window.location.href)

        if (current.pathname.startsWith('/bis-continual-process-automation-demo')) {
          const legacyDestination = new URL('https://kumarnavish.github.io/promopilot/')
          legacyDestination.search = current.search
          legacyDestination.hash = current.hash
          window.location.replace(legacyDestination.toString())
          return
        }

        const originalRoute = `${current.pathname}${current.search}${current.hash}`
        const destination = new URL('/', current.origin)
        destination.searchParams.set('__field_route', originalRoute)
        window.location.replace(destination.toString())
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #10131a;
        background: #ffffff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(34, 94, 231, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 94, 231, 0.035) 1px, transparent 1px),
          #ffffff;
        background-size: 80px 80px;
      }

      main {
        width: min(38rem, calc(100% - 2rem));
        padding-top: 1rem;
        border-top: 1px solid #bec9d8;
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(2rem, 7vw, 4.2rem);
        font-weight: 400;
        letter-spacing: -0.045em;
      }

      p {
        margin: 0.9rem 0 0;
        color: #687386;
        line-height: 1.65;
      }

      a {
        color: #225ee7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening the instrument.</h1>
      <p>
        The requested research route is being restored. If redirection is disabled,
        <a href="/">open the portfolio</a>.
      </p>
    </main>
  </body>
</html>
