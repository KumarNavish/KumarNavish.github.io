<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening FIELD</title>
    <script>
      ;(() => {
        const current = new URL(window.location.href)

        if (current.pathname.startsWith('/bis-continual-process-automation-demo')) {
          const legacyDestination = new URL('https://kumarnavish.github.io/promopilot/')
          legacyDestination.search = current.search
          legacyDestination.hash = current.hash
          window.location.replace(legacyDestination.toString())
          return
        }

        const originalRoute = `${current.pathname}${current.search}${current.hash}`
        const destination = new URL('/', current.origin)
        destination.searchParams.set('__field_route', originalRoute)
        window.location.replace(destination.toString())
      })()
    </script>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #f5f3ed;
        background: #090b0e;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 2rem));
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 6vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.8rem 0 0;
        color: #9ba4ae;
        line-height: 1.6;
      }

      a {
        color: #9de5ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening FIELD.</h1>
      <p>
        The requested research route is being restored. If redirection is disabled,
        <a href="/">open the portfolio</a>.
      </p>
    </main>
  </body>
</html>
